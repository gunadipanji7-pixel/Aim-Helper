name: Build Aim Helper APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -q AimHelper-Native-Overlay-OnlineBuild.zip

      - name: Fix Android project
        run: |
          PROJECT="AimHelper-Native-Overlay-v1"

          printf '%s\n' \
            'android.useAndroidX=true' \
            'android.enableJetifier=true' \
            > "$PROJECT/gradle.properties"

          cat > "$PROJECT/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.aimhelper.overlay'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.aimhelper.overlay'
                  minSdk 26
                  targetSdk 35
                  versionCode 2
                  versionName '1.1'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > "$PROJECT/app/src/main/java/com/aimhelper/overlay/MainActivity.java" <<'EOF'
          package com.aimhelper.overlay;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.Button;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  Button permission = findViewById(R.id.btnOverlayPermission);
                  Button start = findViewById(R.id.btnStart);
                  Button stop = findViewById(R.id.btnStop);

                  permission.setOnClickListener(v -> {
                      if (!Settings.canDrawOverlays(this)) {
                          Intent intent = new Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + getPackageName())
                          );
                          startActivity(intent);
                      } else {
                          Toast.makeText(
                              this,
                              "Izin overlay sudah aktif.",
                              Toast.LENGTH_SHORT
                          ).show();
                      }
                  });

                  start.setOnClickListener(v -> {
                      if (!Settings.canDrawOverlays(this)) {
                          Toast.makeText(
                              this,
                              "Aktifkan izin overlay dulu.",
                              Toast.LENGTH_LONG
                          ).show();
                          return;
                      }

                      Intent intent = new Intent(this, OverlayService.class);
                      startForegroundService(intent);

                      Toast.makeText(
                          this,
                          "Aim Helper Overlay aktif.",
                          Toast.LENGTH_SHORT
                      ).show();
                  });

                  stop.setOnClickListener(v -> {
                      stopService(new Intent(this, OverlayService.class));

                      Toast.makeText(
                          this,
                          "Overlay dimatikan.",
                          Toast.LENGTH_SHORT
                      ).show();
                  });
              }
          }
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build APK
        run: |
          cd AimHelper-Native-Overlay-v1
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AimHelper-APK
          path: AimHelper-Native-Overlay-v1/app/build/outputs/apk/debug/*.apk
