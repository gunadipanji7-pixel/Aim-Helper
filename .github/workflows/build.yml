name: Build Aim Helper APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -q AimHelper-Native-Overlay-OnlineBuild.zip

      - name: Configure AndroidX
        run: |
          PROJECT="AimHelper-Native-Overlay-v1"

          cat > "$PROJECT/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > "$PROJECT/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.aimhelper.overlay'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.aimhelper.overlay'
                  minSdk 23
                  targetSdk 35
                  versionCode 3
                  versionName '1.2'
              }
          }
          EOF

      - name: Prepare Manual Ruler
        run: |
          PROJECT="AimHelper-Native-Overlay-v1"

          test -f "$PROJECT/app/src/main/java/com/aimhelper/overlay/OverlayService.java"

          echo "Manual Ruler source ditemukan"
          grep -q "bounceCount" \
            "$PROJECT/app/src/main/java/com/aimhelper/overlay/OverlayService.java"

      - name: Verify project
        run: |
          PROJECT="AimHelper-Native-Overlay-v1"

          test -f "$PROJECT/gradle.properties"
          test -f "$PROJECT/app/build.gradle"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT/app/src/main/java/com/aimhelper/overlay/MainActivity.java"
          test -f "$PROJECT/app/src/main/java/com/aimhelper/overlay/OverlayService.java"

          echo "Project OK"
          echo "AndroidX enabled"
          echo "Manual Ruler enabled"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build APK
        run: |
          cd AimHelper-Native-Overlay-v1
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AimHelper-APK-Manual-Ruler
          path: AimHelper-Native-Overlay-v1/app/build/outputs/apk/debug/*.apk
