name: Build Aim Helper APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -q AimHelper-Native-Overlay-OnlineBuild.zip

      - name: Replace app files
        env:
          MAIN_B64:  
          OVERLAY_B64: cGFja2FnZSBjb20uYWltaGVscGVyLm92ZXJsYXk7CgovLyBTT1VSQ0UgUkVEQUNURUQgQllFUkVEQ0hFQyBGT1IgU0FGRSBCVUlMRC4K
        run: |
          PROJECT="AimHelper-Native-Overlay-v1"

          printf '%s' "$MAIN_B64" | base64 -d > "$PROJECT/app/src/main/java/com/aimhelper/overlay/MainActivity.java"

          cat > "$PROJECT/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > "$PROJECT/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.aimhelper.overlay'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.aimhelper.overlay'
                  minSdk 26
                  targetSdk 34
                  versionCode 9
                  versionName '1.8'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Clean old Java sources
        run: |
          PROJECT="AimHelper-Native-Overlay-v1"

          find "$PROJECT/app/src/main/java" -type f -name "*.kt" -delete

          find "$PROJECT/app/src/main/java" -type f -name "*.java" \
            ! -name "MainActivity.java" \
            ! -name "OverlayService.java" \
            -delete

      - name: Verify project
        run: |
          PROJECT="AimHelper-Native-Overlay-v1"

          test -s "$PROJECT/app/src/main/java/com/aimhelper/overlay/MainActivity.java"
          test -s "$PROJECT/app/src/main/java/com/aimhelper/overlay/OverlayService.java"

          grep -q "extends Activity" \
            "$PROJECT/app/src/main/java/com/aimhelper/overlay/MainActivity.java"

          grep -q "extends Service" \
            "$PROJECT/app/src/main/java/com/aimhelper/overlay/OverlayService.java"

          echo "Aim Helper source verified"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build APK
        run: |
          cd AimHelper-Native-Overlay-v1
          gradle clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AimHelper-APK-Analog-v1.8
          path: AimHelper-Native-Overlay-v1/app/build/outputs/apk/debug/*.apk
