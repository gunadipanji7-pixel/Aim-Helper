name: Build Aim Helper Trainer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create project
        shell: bash
        run: |
          rm -rf AimTrainer
          mkdir -p AimTrainer/app/src/main/java/com/aimtrainer
          mkdir -p AimTrainer/app/src/main/res/values

          cat > AimTrainer/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AimTrainer"
          include(":app")
          EOF

          cat > AimTrainer/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > AimTrainer/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.enableJetifier=false
          EOF

          cat > AimTrainer/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.aimtrainer'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.aimtrainer'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > AimTrainer/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Aim Trainer</string>
          </resources>
          EOF

          cat > AimTrainer/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="@string/app_name"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > AimTrainer/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#00E676</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
              </style>
          </resources>
          EOF

          cat > AimTrainer/app/src/main/java/com/aimtrainer/MainActivity.java <<'EOF'
          package com.aimtrainer;

          import android.app.Activity;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Canvas;
          import android.graphics.PointF;
          import android.net.Uri;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              AimView aimView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(30, 30, 30, 30);
                  root.setBackgroundColor(Color.rgb(18,18,18));

                  TextView title = new TextView(this);
                  title.setText("🎯 Aim Trainer");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(25);
                  title.setPadding(0,0,0,20);
                  root.addView(title);

                  TextView info = new TextView(this);
                  info.setText(
                      "Mode otomatis\\n\\n" +
                      "Lingkaran target dan garis bidik dihitung oleh aplikasi.\\n" +
                      "Tidak ada auto-click atau auto-shot."
                  );
                  info.setTextColor(Color.LTGRAY);
                  info.setTextSize(16);
                  root.addView(info);

                  Button overlay = new Button(this);
                  overlay.setText("Izinkan Overlay");
                  root.addView(overlay);

                  Button start = new Button(this);
                  start.setText("Nyalakan Aim Trainer");
                  root.addView(start);

                  overlay.setOnClickListener(v -> {
                      if (!Settings.canDrawOverlays(this)) {
                          Intent i = new Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + getPackageName())
                          );
                          startActivity(i);
                      }
                  });

                  start.setOnClickListener(v -> {
                      if (!Settings.canDrawOverlays(this)) {
                          Intent i = new Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + getPackageName())
                          );
                          startActivity(i);
                          return;
                      }

                      showTrainer();
                  });

                  setContentView(root);
              }

              private void showTrainer() {
                  aimView = new AimView();

                  WindowManager wm =
                      (WindowManager)getSystemService(WINDOW_SERVICE);

                  WindowManager.LayoutParams lp =
                      new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE |
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          android.graphics.PixelFormat.TRANSLUCENT
                      );

                  wm.addView(aimView, lp);
              }

              class AimView extends View {

                  Paint line = new Paint(Paint.ANTI_ALIAS_FLAG);
                  Paint target = new Paint(Paint.ANTI_ALIAS_FLAG);
                  Paint panel = new Paint(Paint.ANTI_ALIAS_FLAG);

                  PointF white = new PointF(300, 900);
                  PointF ball = new PointF(650, 500);

                  boolean dragging = false;

                  AimView() {
                      super(MainActivity.this);

                      line.setStrokeWidth(7);
                      line.setColor(Color.WHITE);
                      line.setStyle(Paint.Style.STROKE);

                      target.setStrokeWidth(5);
                      target.setColor(Color.GREEN);
                      target.setStyle(Paint.Style.STROKE);

                      panel.setColor(0xCC111111);
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      super.onDraw(c);

                      float dx = ball.x - white.x;
                      float dy = ball.y - white.y;
                      float length = (float)Math.sqrt(dx*dx + dy*dy);

                      if (length < 1) return;

                      float ux = dx / length;
                      float uy = dy / length;

                      // Garis bidik utama
                      c.drawLine(
                          white.x,
                          white.y,
                          ball.x,
                          ball.y,
                          line
                      );

                      // Lingkaran target
                      c.drawCircle(
                          ball.x,
                          ball.y,
                          30,
                          target
                      );

                      // Garis setelah target
                      float endX = ball.x + ux * 500;
                      float endY = ball.y + uy * 500;

                      line.setColor(0xAAFFFFFF);
                      line.setStrokeWidth(4);

                      c.drawLine(
                          ball.x,
                          ball.y,
                          endX,
                          endY,
                          line
                      );

                      // Pantulan meja
                      float rx = endX;
                      float ry = endY;

                      if (rx < 0 || rx > getWidth()) {
                          ux = -ux;
                          rx = ball.x + ux * 400;
                          ry = ball.y + uy * 400;
                      }

                      if (ry < 0 || ry > getHeight()) {
                          uy = -uy;
                          rx = ball.x + ux * 400;
                          ry = ball.y + uy * 400;
                      }

                      line.setColor(0xAA00FF88);
                      c.drawLine(
                          ball.x,
                          ball.y,
                          rx,
                          ry,
                          line
                      );

                      // Panel status
                      c.drawRoundRect(
                          30, 40, 390, 125,
                          20, 20, panel
                      );

                      Paint text = new Paint(Paint.ANTI_ALIAS_FLAG);
                      text.setColor(Color.WHITE);
                      text.setTextSize(25);

                      c.drawText(
                          "🎯 AIM TRAINER • AUTO",
                          50, 78, text
                      );

                      text.setTextSize(18);
                      c.drawText(
                          "TARGET",
                          50, 108, text
                      );
                  }

                  @Override
                  public boolean onTouchEvent(MotionEvent e) {

                      if (e.getAction() == MotionEvent.ACTION_DOWN) {
                          float dx = e.getX() - ball.x;
                          float dy = e.getY() - ball.y;

                          if (dx*dx + dy*dy < 70*70) {
                              dragging = true;
                              return true;
                          }
                      }

                      if (e.getAction() == MotionEvent.ACTION_MOVE && dragging) {
                          ball.x = e.getX();
                          ball.y = e.getY();
                          invalidate();
                          return true;
                      }

                      if (e.getAction() == MotionEvent.ACTION_UP) {
                          dragging = false;
                          return true;
                      }

                      return true;
                  }
              }
          }
          EOF

      - name: Download Gradle
        run: |
          cd AimTrainer
          curl -L -o gradle.zip \
            https://services.gradle.org/distributions/gradle-8.2.1-bin.zip
          unzip -q gradle.zip
          mv gradle-8.2.1 gradle-dist

      - name: Build APK
        run: |
          cd AimTrainer
          ./gradle-dist/bin/gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AimTrainer-APK
          path: AimTrainer/app/build/outputs/apk/debug/app-debug.apk
