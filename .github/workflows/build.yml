name: Build Aim Helper APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -q AimHelper-Native-Overlay-OnlineBuild.zip

      - name: Prepare Stage 2
        run: |
          PROJECT="AimHelper-Native-Overlay-v1"

          printf '%s\n' \
            'android.useAndroidX=true' \
            'android.enableJetifier=true' \
            > "$PROJECT/gradle.properties"

          cat > "$PROJECT/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.aimhelper.overlay'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.aimhelper.overlay'
                  minSdk 26
                  targetSdk 35
                  versionCode 3
                  versionName '2.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > "$PROJECT/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:label="Aim Helper"
                  android:theme="@style/AppTheme"
                  android:resizeableActivity="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection|specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Display Aim Helper visual guidance overlay" />
                  </service>

              </application>
          </manifest>
          EOF

          cat > "$PROJECT/app/src/main/res/layout/activity_main.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#07141E">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="24dp">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="🎯 Aim Helper"
                      android:textColor="#FFFFFF"
                      android:textSize="30sp"
                      android:textStyle="bold"/>

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:text="Native Overlay — Tahap 2"
                      android:textColor="#8FA9B9"
                      android:textSize="16sp"/>

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="25dp"
                      android:text="Tahap ini membaca layar game dengan izin tangkap layar dan mencoba mendeteksi bola putih."
                      android:textColor="#D6E5ED"
                      android:textSize="16sp"
                      android:lineSpacingExtra="4dp"/>

                  <Button
                      android:id="@+id/btnOverlayPermission"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="25dp"
                      android:text="1. Izinkan tampil di atas aplikasi"
                      android:textAllCaps="false"/>

                  <Button
                      android:id="@+id/btnCapture"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="14dp"
                      android:text="2. Izinkan tangkap layar"
                      android:textAllCaps="false"/>

                  <Button
                      android:id="@+id/btnStart"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="14dp"
                      android:text="3. Nyalakan Aim Helper"
                      android:textAllCaps="false"/>

                  <Button
                      android:id="@+id/btnStop"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="14dp"
                      android:text="Matikan Aim Helper"
                      android:textAllCaps="false"/>

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="25dp"
                      android:text="Catatan: fitur ini hanya membaca tampilan dan menggambar panduan. Tidak ada auto-click, auto-shot, atau pengendalian permainan."
                      android:textColor="#8FA9B9"
                      android:textSize="14sp"/>

              </LinearLayout>
          </ScrollView>
          EOF

          cat > "$PROJECT/app/src/main/java/com/aimhelper/overlay/MainActivity.java" <<'EOF'
          package com.aimhelper.overlay;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.Button;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private static final int SCREEN_CAPTURE_REQUEST = 1001;
              private Intent captureData;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  Button overlay = findViewById(R.id.btnOverlayPermission);
                  Button capture = findViewById(R.id.btnCapture);
                  Button start = findViewById(R.id.btnStart);
                  Button stop = findViewById(R.id.btnStop);

                  overlay.setOnClickListener(v -> {
                      if (!Settings.canDrawOverlays(this)) {
                          Intent i = new Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + getPackageName())
                          );
                          startActivity(i);
                      } else {
                          Toast.makeText(
                              this,
                              "Izin overlay sudah aktif.",
                              Toast.LENGTH_SHORT
                          ).show();
                      }
                  });

                  capture.setOnClickListener(v -> requestScreenCapture());

                  start.setOnClickListener(v -> {
                      if (!Settings.canDrawOverlays(this)) {
                          Toast.makeText(
                              this,
                              "Aktifkan izin overlay dulu.",
                              Toast.LENGTH_LONG
                          ).show();
                          return;
                      }

                      if (captureData == null) {
                          Toast.makeText(
                              this,
                              "Tekan Izinkan tangkap layar dulu.",
                              Toast.LENGTH_LONG
                          ).show();
                          return;
                      }

                      Intent service = new Intent(this, OverlayService.class);
                      service.putExtra("resultCode", Activity.RESULT_OK);
                      service.putExtra("data", captureData);
                      startForegroundService(service);

                      Toast.makeText(
                          this,
                          "Aim Helper Tahap 2 aktif.",
                          Toast.LENGTH_SHORT
                      ).show();
                  });

                  stop.setOnClickListener(v -> {
                      stopService(new Intent(this, OverlayService.class));
                      Toast.makeText(
                          this,
                          "Aim Helper dimatikan.",
                          Toast.LENGTH_SHORT
                      ).show();
                  });
              }

              private void requestScreenCapture() {
                  android.media.projection.MediaProjectionManager manager =
                      (android.media.projection.MediaProjectionManager)
                      getSystemService(MEDIA_PROJECTION_SERVICE);

                  Intent intent = manager.createScreenCaptureIntent();
                  startActivityForResult(intent, SCREEN_CAPTURE_REQUEST);
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == SCREEN_CAPTURE_REQUEST &&
                      resultCode == RESULT_OK &&
                      data != null) {

                      captureData = data;

                      Toast.makeText(
                          this,
                          "Izin tangkap layar berhasil.",
                          Toast.LENGTH_SHORT
                      ).show();
                  }
              }
          }
          EOF

          cat > "$PROJECT/app/src/main/java/com/aimhelper/overlay/OverlayService.java" <<'EOF'
          package com.aimhelper.overlay;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.PixelFormat;
          import android.media.Image;
          import android.media.ImageReader;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.os.Build;
          import android.os.IBinder;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.TextView;

          import java.nio.ByteBuffer;

          public class OverlayService extends Service {

              private WindowManager wm;
              private AimCanvas canvas;
              private TextView panel;

              private MediaProjection projection;
              private ImageReader reader;

              private volatile float detectedX = -1;
              private volatile float detectedY = -1;

              private static final String CHANNEL = "aim_helper_stage2";

              @Override
              public void onCreate() {
                  super.onCreate();

                  createChannel();
                  startForeground(7, buildNotification());

                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {

                  if (!Settings.canDrawOverlays(this)) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }

                  showOverlay();

                  if (intent != null) {
                      int resultCode = intent.getIntExtra(
                          "resultCode",
                          0
                      );

                      Intent data = intent.getParcelableExtra("data");

                      if (data != null && resultCode == RESULT_OK) {
                          startCapture(resultCode, data);
                      }
                  }

                  return START_STICKY;
              }

              private void showOverlay() {

                  if (canvas != null) return;

                  WindowManager.LayoutParams drawParams =
                      new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                              | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                              | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                              | WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT
                      );

                  drawParams.gravity = Gravity.TOP | Gravity.START;

                  canvas = new AimCanvas(this);
                  wm.addView(canvas, drawParams);

                  panel = new TextView(this);
                  panel.setText(
                      "🎯 Aim Helper ON\n" +
                      "Screen Capture: ON\n" +
                      "Deteksi: mencari bola putih..."
                  );
                  panel.setTextColor(Color.WHITE);
                  panel.setTextSize(14);
                  panel.setPadding(25, 18, 25, 18);
                  panel.setBackgroundResource(R.drawable.panel_bg);

                  WindowManager.LayoutParams panelParams =
                      new WindowManager.LayoutParams(
                          330,
                          155,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT
                      );

                  panelParams.gravity = Gravity.TOP | Gravity.END;
                  panelParams.x = 15;
                  panelParams.y = 75;

                  wm.addView(panel, panelParams);
              }

              private void startCapture(int resultCode, Intent data) {

                  MediaProjectionManager manager =
                      (MediaProjectionManager)
                      getSystemService(MEDIA_PROJECTION_SERVICE);

                  projection =
                      manager.getMediaProjection(resultCode, data);

                  if (projection == null) return;

                  int width = getResources()
                      .getDisplayMetrics().widthPixels;

                  int height = getResources()
                      .getDisplayMetrics().heightPixels;

                  int density = getResources()
                      .getDisplayMetrics().densityDpi;

                  reader = ImageReader.newInstance(
                      width,
                      height,
                      PixelFormat.RGBA_8888,
                      2
                  );

                  projection.createVirtualDisplay(
                      "AimHelperCapture",
                      width,
                      height,
                      density,
                      0,
                      reader.getSurface(),
                      null,
                      null
                  );

                  reader.setOnImageAvailableListener(
                      r -> processImage(r),
                      null
                  );
              }

              private void processImage(ImageReader r) {

                  Image image = null;

                  try {
                      image = r.acquireLatestImage();

                      if (image == null) return;

                      Image.Plane plane = image.getPlanes()[0];
                      ByteBuffer buffer = plane.getBuffer();

                      int pixelStride = plane.getPixelStride();
                      int rowStride = plane.getRowStride();
                      int width = image.getWidth();
                      int height = image.getHeight();

                      int scanStep = 6;

                      float bestX = -1;
                      float bestY = -1;
                      int bestScore = 0;

                      int startY = (int)(height * 0.18f);
                      int endY = (int)(height * 0.90f);
                      int startX = (int)(width * 0.12f);
                      int endX = (int)(width * 0.88f);

                      for (int y = startY; y < endY; y += scanStep) {

                          int rowOffset = y * rowStride;

                          for (int x = startX; x < endX; x += scanStep) {

                              int offset =
                                  rowOffset + x * pixelStride;

                              if (offset + 3 >= buffer.limit()) continue;

                              int rr = buffer.get(offset) & 0xff;
                              int gg = buffer.get(offset + 1) & 0xff;
                              int bb = buffer.get(offset + 2) & 0xff;

                              int brightness =
                                  (rr + gg + bb) / 3;

                              int whiteScore =
                                  255 - Math.abs(rr - gg)
                                      - Math.abs(gg - bb);

                              if (brightness > 205 &&
                                  whiteScore > 210) {

                                  int score =
                                      brightness +
                                      whiteScore;

                                  if (score > bestScore) {
                                      bestScore = score;
                                      bestX = x;
                                      bestY = y;
                                  }
                              }
                          }
                      }

                      detectedX = bestX;
                      detectedY = bestY;

                      if (canvas != null) {
                          canvas.postInvalidate();
                      }

                  } catch (Exception ignored) {
                  } finally {
                      if (image != null) image.close();
                  }
              }

              private Notification buildNotification() {

                  return new Notification.Builder(
                      this,
                      CHANNEL
                  )
                      .setContentTitle("Aim Helper")
                      .setContentText(
                          "Screen capture dan overlay aktif"
                      )
                      .setSmallIcon(
                          android.R.drawable.ic_menu_compass
                      )
                      .setOngoing(true)
                      .build();
              }

              private void createChannel() {

                  if (Build.VERSION.SDK_INT >= 26) {

                      NotificationChannel c =
                          new NotificationChannel(
                              CHANNEL,
                              "Aim Helper Tahap 2",
                              NotificationManager.IMPORTANCE_LOW
                          );

                      NotificationManager nm =
                          (NotificationManager)
                          getSystemService(
                              Context.NOTIFICATION_SERVICE
                          );

                      nm.createNotificationChannel(c);
                  }
              }

              @Override
              public void onDestroy() {

                  if (reader != null) {
                      reader.close();
                      reader = null;
                  }

                  if (projection != null) {
                      projection.stop();
                      projection = null;
                  }

                  if (wm != null) {
                      if (canvas != null) {
                          wm.removeView(canvas);
                          canvas = null;
                      }

                      if (panel != null) {
                          wm.removeView(panel);
                          panel = null;
                      }
                  }

                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              private class AimCanvas extends View {

                  private final Paint p =
                      new Paint(Paint.ANTI_ALIAS_FLAG);

                  AimCanvas(Context context) {
                      super(context);
                      p.setStrokeCap(Paint.Cap.ROUND);
                  }

                  @Override
                  protected void onDraw(Canvas c) {

                      super.onDraw(c);

                      float w = getWidth();
                      float h = getHeight();

                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(5);
                      p.setColor(
                          Color.rgb(57, 242, 122)
                      );

                      if (detectedX >= 0 &&
                          detectedY >= 0) {

                          c.drawCircle(
                              detectedX,
                              detectedY,
                              28,
                              p
                          );

                          p.setStyle(Paint.Style.FILL);
                          p.setTextSize(28);
                          c.drawText(
                              "BOLA?",
                              detectedX + 35,
                              detectedY,
                              p
                          );
                      }

                      // Garis referensi sementara
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(3);
                      p.setColor(
                          Color.argb(
                              180,
                              57,
                              242,
                              122
                          )
                      );

                      c.drawLine(
                          w * 0.50f,
                          h * 0.76f,
                          w * 0.50f,
                          h * 0.46f,
                          p
                      );
                  }
              }
          }
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build APK
        run: |
          cd AimHelper-Native-Overlay-v1
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AimHelper-APK-Stage2
          path: AimHelper-Native-Overlay-v1/app/build/outputs/apk/debug/*.apk
