name: Build Aim Helper APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q AimHelper-Native-Overlay-OnlineBuild.zip
          PROJECT="AimHelper-Native-Overlay-v1"

          cat > "$PROJECT/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > "$PROJECT/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.aimhelper.overlay'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.aimhelper.overlay'
                  minSdk 23
                  targetSdk 35
                  versionCode 9
                  versionName '1.8'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          configurations.configureEach {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

          mkdir -p "$PROJECT/app/src/main/java/com/aimhelper/overlay"
          mkdir -p "$PROJECT/app/src/main/res/values"

          cat > "$PROJECT/app/src/main/res/values/strings.xml" <<'EOF'
          <resources>
              <string name="app_name">Aim Helper</string>
          </resources>
          EOF

          cat > "$PROJECT/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>

              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Aim Helper"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".OverlayService"
                      android:exported="false"/>

              </application>
          </manifest>
          EOF

          cat > "$PROJECT/app/src/main/java/com/aimhelper/overlay/MainActivity.java" <<'EOF'
          package com.aimhelper.overlay;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(35, 45, 35, 35);
                  root.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.setBackgroundColor(Color.WHITE);

                  TextView title = new TextView(this);
                  title.setText("🎯 Aim Helper");
                  title.setTextSize(28);
                  title.setTextColor(Color.BLACK);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title, new LinearLayout.LayoutParams(
                          -1, 80
                  ));

                  TextView sub = new TextView(this);
                  sub.setText(
                          "Mistar Manual + Target + Analog\\n\\n" +
                          "• Hanya 1 penanda bola target\\n" +
                          "• Garis dimulai dari bola putih\\n" +
                          "• Target dapat digeser\\n" +
                          "• Analog dapat menggeser target\\n" +
                          "• Panel kontrol dapat dipindahkan\\n" +
                          "• Tidak ada auto-click / auto-shot"
                  );
                  sub.setTextSize(16);
                  sub.setTextColor(Color.DKGRAY);
                  sub.setPadding(0, 10, 0, 30);
                  root.addView(sub);

                  Button permission = new Button(this);
                  permission.setText("1. Izinkan tampil di atas aplikasi");
                  root.addView(permission, new LinearLayout.LayoutParams(
                          -1, 65
                  ));

                  Button start = new Button(this);
                  start.setText("2. NYALAKAN AIM HELPER");
                  root.addView(start, new LinearLayout.LayoutParams(
                          -1, 70
                  ));

                  Button stop = new Button(this);
                  stop.setText("3. MATIKAN AIM HELPER");
                  root.addView(stop, new LinearLayout.LayoutParams(
                          -1, 70
                  ));

                  TextView info = new TextView(this);
                  info.setText(
                          "\\nCara memakai:\\n" +
                          "1. Izinkan overlay.\\n" +
                          "2. Nyalakan Aim Helper.\\n" +
                          "3. Buka 8 Ball Pool.\\n" +
                          "4. Geser lingkaran target ke bola yang ingin dibidik.\\n" +
                          "5. Gunakan analog untuk koreksi posisi target.\\n" +
                          "6. Panel dapat digeser ke tempat yang nyaman."
                  );
                  info.setTextSize(15);
                  info.setTextColor(Color.DKGRAY);
                  root.addView(info);

                  permission.setOnClickListener(v -> {
                      try {
                          Intent intent = new Intent(
                                  Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse("package:" + getPackageName())
                          );
                          startActivity(intent);
                      } catch (Exception e) {
                          startActivity(new Intent(
                                  Settings.ACTION_MANAGE_OVERLAY_PERMISSION
                          ));
                      }
                  });

                  start.setOnClickListener(v -> {
                      if (Settings.canDrawOverlays(this)) {
                          Intent intent = new Intent(this, OverlayService.class);
                          startService(intent);
                      } else {
                          permission.performClick();
                      }
                  });

                  stop.setOnClickListener(v -> {
                      stopService(new Intent(this, OverlayService.class));
                  });

                  setContentView(root);
              }
          }
          EOF

          cat > "$PROJECT/app/src/main/java/com/aimhelper/overlay/OverlayService.java" <<'EOF'
          package com.aimhelper.overlay;

          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.DashPathEffect;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.RectF;
          import android.os.IBinder;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.FrameLayout;
          import android.widget.TextView;

          public class OverlayService extends Service {

              private WindowManager wm;
              private FrameLayout root;
              private AimCanvas canvas;
              private TextView panel;

              private WindowManager.LayoutParams rootParams;
              private WindowManager.LayoutParams panelParams;

              @Override
              public void onCreate() {
                  super.onCreate();

                  if (!Settings.canDrawOverlays(this)) {
                      stopSelf();
                      return;
                  }

                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);

                  root = new FrameLayout(this);

                  canvas = new AimCanvas();
                  root.addView(canvas, new FrameLayout.LayoutParams(
                          -1, -1
                  ));

                  panel = new TextView(this);
                  panel.setText(
                          "🎯 MISTAR ON\\n" +
                          "TARGET  •  ANALOG\\n" +
                          "Pantul: 1x"
                  );
                  panel.setTextSize(13);
                  panel.setTextColor(Color.WHITE);
                  panel.setGravity(Gravity.CENTER);
                  panel.setPadding(18, 12, 18, 12);
                  panel.setBackgroundColor(Color.argb(190, 20, 20, 20));

                  panelParams = new WindowManager.LayoutParams(
                          260,
                          105,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE |
                          WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                          -3
                  );
                  panelParams.gravity = Gravity.TOP | Gravity.RIGHT;
                  panelParams.x = 20;
                  panelParams.y = 80;

                  panel.setOnTouchListener(new View.OnTouchListener() {
                      float downX;
                      float downY;
                      int startX;
                      int startY;

                      @Override
                      public boolean onTouch(View v, MotionEvent event) {
                          if (event.getAction() == MotionEvent.ACTION_DOWN) {
                              downX = event.getRawX();
                              downY = event.getRawY();
                              startX = panelParams.x;
                              startY = panelParams.y;
                              return true;
                          }

                          if (event.getAction() == MotionEvent.ACTION_MOVE) {
                              panelParams.x =
                                      startX + (int)(event.getRawX() - downX);

                              panelParams.y =
                                      startY + (int)(event.getRawY() - downY);

                              wm.updateViewLayout(panel, panelParams);
                              return true;
                          }

                          return true;
                      }
                  });

                  rootParams = new WindowManager.LayoutParams(
                          -1,
                          -1,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE |
                          WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL |
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                          -3
                  );

                  rootParams.gravity = Gravity.TOP | Gravity.LEFT;

                  wm.addView(root, rootParams);
                  wm.addView(panel, panelParams);
              }

              @Override
              public int onStartCommand(
                      Intent intent,
                      int flags,
                      int startId
              ) {
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  try {
                      if (panel != null) wm.removeView(panel);
                  } catch (Exception ignored) {}

                  try {
                      if (root != null) wm.removeView(root);
                  } catch (Exception ignored) {}

                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              private class AimCanvas extends View {

                  Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  Paint dashed = new Paint(Paint.ANTI_ALIAS_FLAG);

                  float whiteX = 0.38f;
                  float whiteY = 0.58f;

                  float targetX = 0.63f;
                  float targetY = 0.43f;

                  float tableL;
                  float tableR;
                  float tableT;
                  float tableB;

                  float joyCX;
                  float joyCY;

                  boolean draggingTarget = false;
                  boolean draggingJoystick = false;

                  float lastJoyX;
                  float lastJoyY;

                  int bounceCount = 1;

                  AimCanvas() {
                      super(OverlayService.this);

                      paint.setStrokeWidth(5);
                      paint.setStyle(Paint.Style.STROKE);

                      dashed.setStrokeWidth(4);
                      dashed.setStyle(Paint.Style.STROKE);
                      dashed.setPathEffect(
                              new DashPathEffect(
                                      new float[]{18, 14},
                                      0
                              )
                      );

                      setBackgroundColor(Color.TRANSPARENT);
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      super.onDraw(c);

                      float w = getWidth();
                      float h = getHeight();

                      tableL = w * 0.17f;
                      tableR = w * 0.86f;
                      tableT = h * 0.16f;
                      tableB = h * 0.91f;

                      joyCX = w * 0.15f;
                      joyCY = h * 0.82f;

                      float sx = w * whiteX;
                      float sy = h * whiteY;

                      float tx = w * targetX;
                      float ty = h * targetY;

                      drawAimLine(c, sx, sy, tx, ty);
                      drawBounce(c, sx, sy, tx, ty);
                      drawTarget(c, tx, ty);
                      drawJoystick(c);
                  }

                  private void drawAimLine(
                          Canvas c,
                          float sx,
                          float sy,
                          float tx,
                          float ty
                  ) {
                      paint.setColor(Color.WHITE);
                      paint.setAlpha(230);
                      paint.setStrokeWidth(6);
                      paint.setStyle(Paint.Style.STROKE);

                      c.drawLine(sx, sy, tx, ty, paint);
                  }

                  private void drawTarget(
                          Canvas c,
                          float x,
                          float y
                  ) {
                      // Hanya SATU penanda bola target.
                      // Ukuran dibuat menyerupai bola permainan.
                      paint.setStyle(Paint.Style.STROKE);
                      paint.setStrokeWidth(3);
                      paint.setColor(Color.WHITE);
                      paint.setAlpha(220);

                      c.drawCircle(x, y, 17, paint);

                      paint.setStrokeWidth(2);
                      paint.setColor(Color.GREEN);
                      paint.setAlpha(180);

                      c.drawCircle(x, y, 22, paint);
                  }

                  private void drawBounce(
                          Canvas c,
                          float sx,
                          float sy,
                          float tx,
                          float ty
                  ) {
                      float dx = tx - sx;
                      float dy = ty - sy;

                      float x = tx;
                      float y = ty;

                      dashed.setColor(Color.WHITE);
                      dashed.setAlpha(210);
                      dashed.setStrokeWidth(4);

                      Path path = new Path();
                      path.moveTo(sx, sy);

                      for (int i = 0; i < bounceCount; i++) {

                          float nx = x;
                          float ny = y;

                          if (Math.abs(dx) > 0.001f) {
                              float tLeft =
                                      (tableL - x) / dx;

                              float tRight =
                                      (tableR - x) / dx;

                              if (tLeft > 0) {
                                  nx = tableL;
                                  ny = y + dy * tLeft;
                              }

                              if (tRight > 0 &&
                                  (tLeft <= 0 ||
                                   tRight < tLeft)) {
                                  nx = tableR;
                                  ny = y + dy * tRight;
                              }
                          }

                          if (Math.abs(dy) > 0.001f) {
                              float tTop =
                                      (tableT - y) / dy;

                              float tBottom =
                                      (tableB - y) / dy;

                              if (tTop > 0) {
                                  float yy =
                                          y + dy * tTop;

                                  if (nx == x ||
                                      Math.abs(tTop) <
                                      Math.abs((nx - x) / dx)) {
                                      nx = x + dx * tTop;
                                      ny = yy;
                                  }
                              }

                              if (tBottom > 0) {
                                  float yy =
                                          y + dy * tBottom;

                                  if (nx == x ||
                                      Math.abs(tBottom) <
                                      Math.abs((nx - x) / dx)) {
                                      nx = x + dx * tBottom;
                                      ny = yy;
                                  }
                              }
                          }

                          nx = clamp(nx, tableL, tableR);
                          ny = clamp(ny, tableT, tableB);

                          path.lineTo(nx, ny);

                          dx = -dx;
                          dy = -dy;

                          x = nx;
                          y = ny;
                      }

                      path.lineTo(
                              clamp(
                                      x + dx * 0.8f,
                                      tableL,
                                      tableR
                              ),
                              clamp(
                                      y + dy * 0.8f,
                                      tableT,
                                      tableB
                              )
                      );

                      c.drawPath(path, dashed);

                      paint.setStyle(Paint.Style.FILL);
                      paint.setColor(Color.YELLOW);
                      paint.setAlpha(230);

                      c.drawCircle(
                              clamp(x, tableL, tableR),
                              clamp(y, tableT, tableB),
                              7,
                              paint
                      );
                  }

                  private void drawJoystick(Canvas c) {

                      paint.setStyle(Paint.Style.STROKE);
                      paint.setStrokeWidth(3);
                      paint.setColor(Color.WHITE);
                      paint.setAlpha(150);

                      c.drawCircle(
                              joyCX,
                              joyCY,
                              55,
                              paint
                      );

                      paint.setStyle(Paint.Style.FILL);
                      paint.setColor(Color.argb(
                              100,
                              0,
                              255,
                              0
                      ));

                      c.drawCircle(
                              joyCX,
                              joyCY,
                              32,
                              paint
                      );

                      paint.setColor(Color.WHITE);
                      paint.setAlpha(220);

                      c.drawCircle(
                              joyCX,
                              joyCY,
                              13,
                              paint
                      );
                  }

                  @Override
                  public boolean onTouchEvent(MotionEvent e) {

                      float x = e.getX();
                      float y = e.getY();

                      float w = getWidth();
                      float h = getHeight();

                      float tx = w * targetX;
                      float ty = h * targetY;

                      if (e.getAction() ==
                              MotionEvent.ACTION_DOWN) {

                          if (distance(x, y, tx, ty) < 45) {
                              draggingTarget = true;
                              return true;
                          }

                          if (distance(
                                  x,
                                  y,
                                  joyCX,
                                  joyCY
                          ) < 80) {
                              draggingJoystick = true;
                              lastJoyX = x;
                              lastJoyY = y;
                              return true;
                          }

                          return true;
                      }

                      if (e.getAction() ==
                              MotionEvent.ACTION_MOVE) {

                          if (draggingTarget) {

                              targetX =
                                      clamp(
                                              x / w,
                                              tableL / w,
                                              tableR / w
                                      );

                              targetY =
                                      clamp(
                                              y / h,
                                              tableT / h,
                                              tableB / h
                                      );

                              invalidate();
                              return true;
                          }

                          if (draggingJoystick) {

                              float moveX =
                                      x - lastJoyX;

                              float moveY =
                                      y - lastJoyY;

                              targetX += moveX / w * 1.4f;
                              targetY += moveY / h * 1.4f;

                              targetX =
                                      clamp(
                                              targetX,
                                              tableL / w,
                                              tableR / w
                                      );

                              targetY =
                                      clamp(
                                              targetY,
                                              tableT / h,
                                              tableB / h
                                      );

                              lastJoyX = x;
                              lastJoyY = y;

                              invalidate();
                              return true;
                          }

                          return true;
                      }

                      if (e.getAction() ==
                              MotionEvent.ACTION_UP ||
                          e.getAction() ==
                              MotionEvent.ACTION_CANCEL) {

                          draggingTarget = false;
                          draggingJoystick = false;

                          invalidate();
                          return true;
                      }

                      return true;
                  }

                  private float distance(
                          float x1,
                          float y1,
                          float x2,
                          float y2
                  ) {
                      float dx = x1 - x2;
                      float dy = y1 - y2;

                      return (float)Math.sqrt(
                              dx * dx + dy * dy
                      );
                  }

                  private float clamp(
                          float value,
                          float min,
                          float max
                  ) {
                      return Math.max(
                              min,
                              Math.min(max, value)
                      );
                  }
              }
          }
          EOF

      - name: Fix Gradle wrapper
        run: |
          cd AimHelper-Native-Overlay-v1
          chmod +x gradlew

      - name: Clean build
        run: |
          cd AimHelper-Native-Overlay-v1
          ./gradlew clean --no-daemon

      - name: Build APK
        run: |
          cd AimHelper-Native-Overlay-v1
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AimHelper-APK
          path: AimHelper-Native-Overlay-v1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
