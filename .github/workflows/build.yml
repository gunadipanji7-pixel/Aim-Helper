name: Build Aim Helper APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -q AimHelper-Native-Overlay-OnlineBuild.zip

      - name: Configure project
        run: |
          PROJECT="AimHelper-Native-Overlay-v1"

          cat > "$PROJECT/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > "$PROJECT/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.aimhelper.overlay'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.aimhelper.overlay'
                  minSdk 23
                  targetSdk 35
                  versionCode 8
                  versionName '1.7'
              }
          }
          EOF

      - name: Configure MainActivity
        run: |
          PROJECT="AimHelper-Native-Overlay-v1"

          cat > "$PROJECT/app/src/main/java/com/aimhelper/overlay/MainActivity.java" <<'JAVA'
          package com.aimhelper.overlay;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              private int dp(float v) {
                  return (int)(v * getResources().getDisplayMetrics().density);
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(24), dp(30), dp(24), dp(24));
                  root.setBackgroundColor(Color.rgb(5,20,28));

                  TextView title = new TextView(this);
                  title.setText("🎯 Aim Helper");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(32);
                  title.setGravity(Gravity.CENTER);

                  root.addView(
                      title,
                      new LinearLayout.LayoutParams(-1, dp(70))
                  );

                  TextView info = new TextView(this);
                  info.setText(
                      "⚪ Bola putih → 🎯 1 bola target → garis bidik\n\n" +
                      "Penanda hanya untuk bola target.\n" +
                      "Tidak ada auto-click atau auto-shot."
                  );
                  info.setTextColor(Color.rgb(205,220,228));
                  info.setTextSize(17);
                  info.setPadding(0, dp(10), 0, dp(20));

                  root.addView(
                      info,
                      new LinearLayout.LayoutParams(-1, dp(160))
                  );

                  Button permission = new Button(this);
                  permission.setText(
                      "1. Izinkan tampil di atas aplikasi"
                  );

                  permission.setOnClickListener(v -> {
                      if (!Settings.canDrawOverlays(this)) {
                          startActivity(
                              new Intent(
                                  Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse(
                                      "package:" + getPackageName()
                                  )
                              )
                          );
                      }
                  });

                  root.addView(permission, buttonParams());

                  Button start = new Button(this);
                  start.setText("2. Nyalakan Mistar");

                  start.setOnClickListener(v -> {
                      if (!Settings.canDrawOverlays(this)) {
                          return;
                      }

                      Intent i =
                          new Intent(
                              this,
                              OverlayService.class
                          );

                      if (android.os.Build.VERSION.SDK_INT >= 26) {
                          startForegroundService(i);
                      } else {
                          startService(i);
                      }

                      moveTaskToBack(true);
                  });

                  root.addView(start, buttonParams());

                  Button stop = new Button(this);
                  stop.setText("3. Matikan Mistar");

                  stop.setOnClickListener(
                      v -> stopService(
                          new Intent(
                              this,
                              OverlayService.class
                          )
                      )
                  );

                  root.addView(stop, buttonParams());

                  setContentView(root);
              }

              private LinearLayout.LayoutParams buttonParams() {
                  LinearLayout.LayoutParams p =
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(60)
                      );

                  p.setMargins(
                      0,
                      dp(6),
                      0,
                      dp(6)
                  );

                  return p;
              }
          }
          JAVA

      - name: Configure Manifest
        run: |
          PROJECT="AimHelper-Native-Overlay-v1"

          cat > "$PROJECT/app/src/main/AndroidManifest.xml" <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE" />

              <uses-permission
                  android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="Aim Helper"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:stopWithTask="false" />

              </application>

          </manifest>
          XML

      - name: Configure OverlayService
        run: |
          PROJECT="AimHelper-Native-Overlay-v1"

          cat > "$PROJECT/app/src/main/java/com/aimhelper/overlay/OverlayService.java" <<'JAVA'
          package com.aimhelper.overlay;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.os.Build;
          import android.os.IBinder;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class OverlayService extends Service {

              private WindowManager wm;
              private AimCanvas canvas;

              private View cueHandle;
              private View targetHandle;

              private WindowManager.LayoutParams cueLP;
              private WindowManager.LayoutParams targetLP;

              private LinearLayout panel;

              private static final int HANDLE = 64;
              private static final String CHANNEL =
                  "aim_helper_overlay";

              private float tableL;
              private float tableR;
              private float tableT;
              private float tableB;

              private float angleDeg = -8f;

              @Override
              public void onCreate() {
                  super.onCreate();

                  createChannel();
                  startForeground(12, notification());

                  wm = (WindowManager)
                      getSystemService(WINDOW_SERVICE);

                  showOverlay();
              }

              private int W() {
                  return getResources()
                      .getDisplayMetrics()
                      .widthPixels;
              }

              private int H() {
                  return getResources()
                      .getDisplayMetrics()
                      .heightPixels;
              }

              private void showOverlay() {

                  if (!Settings.canDrawOverlays(this)) {
                      stopSelf();
                      return;
                  }

                  int w = W();
                  int h = H();

                  /*
                   * Area dalam meja.
                   */
                  tableL = w * 0.17f;
                  tableR = w * 0.86f;
                  tableT = h * 0.16f;
                  tableB = h * 0.91f;

                  /*
                   * Posisi awal:
                   * bola putih dan satu bola target.
                   */
                  float cueX = w * 0.56f;
                  float cueY = h * 0.56f;

                  float targetX = w * 0.68f;
                  float targetY = h * 0.56f;

                  WindowManager.LayoutParams draw =
                      new WindowManager.LayoutParams(
                          -1,
                          -1,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                              | WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                              | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                          android.graphics.PixelFormat.TRANSLUCENT
                      );

                  draw.gravity =
                      Gravity.TOP | Gravity.START;

                  canvas = new AimCanvas(this);

                  wm.addView(canvas, draw);

                  cueLP =
                      handleParams(
                          cueX,
                          cueY
                      );

                  targetLP =
                      handleParams(
                          targetX,
                          targetY
                      );

                  cueHandle =
                      new DragHandle(
                          this,
                          false
                      );

                  targetHandle =
                      new DragHandle(
                          this,
                          true
                      );

                  wm.addView(
                      cueHandle,
                      cueLP
                  );

                  wm.addView(
                      targetHandle,
                      targetLP
                  );

                  makePanel();
              }

              private WindowManager.LayoutParams handleParams(
                  float x,
                  float y
              ) {

                  WindowManager.LayoutParams p =
                      new WindowManager.LayoutParams(
                          HANDLE,
                          HANDLE,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          android.graphics.PixelFormat.TRANSLUCENT
                      );

                  p.gravity =
                      Gravity.TOP | Gravity.START;

                  p.x =
                      (int)x - HANDLE / 2;

                  p.y =
                      (int)y - HANDLE / 2;

                  return p;
              }

              private void makePanel() {

                  panel =
                      new LinearLayout(this);

                  panel.setOrientation(
                      LinearLayout.HORIZONTAL
                  );

                  panel.setPadding(
                      5,
                      5,
                      5,
                      5
                  );

                  TextView up =
                      button("↑");

                  TextView left =
                      button("←");

                  TextView right =
                      button("→");

                  TextView down =
                      button("↓");

                  TextView rotL =
                      button("↶");

                  TextView rotR =
                      button("↷");

                  addButton(up);
                  addButton(left);
                  addButton(right);
                  addButton(down);
                  addButton(rotL);
                  addButton(rotR);

                  up.setOnClickListener(
                      v -> moveTarget(0,-12)
                  );

                  down.setOnClickListener(
                      v -> moveTarget(0,12)
                  );

                  left.setOnClickListener(
                      v -> moveTarget(-12,0)
                  );

                  right.setOnClickListener(
                      v -> moveTarget(12,0)
                  );

                  rotL.setOnClickListener(
                      v -> {
                          angleDeg -= 2;
                          canvas.invalidate();
                      }
                  );

                  rotR.setOnClickListener(
                      v -> {
                          angleDeg += 2;
                          canvas.invalidate();
                      }
                  );

                  WindowManager.LayoutParams p =
                      new WindowManager.LayoutParams(
                          310,
                          62,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                              | WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                          android.graphics.PixelFormat.TRANSLUCENT
                      );

                  p.gravity =
                      Gravity.TOP | Gravity.END;

                  p.x = 8;
                  p.y = 55;

                  wm.addView(panel,p);
              }

              private TextView button(String text) {

                  TextView b =
                      new TextView(this);

                  b.setText(text);
                  b.setTextColor(Color.WHITE);
                  b.setTextSize(20);
                  b.setGravity(Gravity.CENTER);

                  return b;
              }

              private void addButton(TextView b) {

                  panel.addView(
                      b,
                      new LinearLayout.LayoutParams(
                          50,
                          50
                      )
                  );
              }

              private void moveTarget(
                  int dx,
                  int dy
              ) {

                  int nx =
                      targetLP.x + dx;

                  int ny =
                      targetLP.y + dy;

                  int minX =
                      (int)tableL -
                      HANDLE / 2;

                  int maxX =
                      (int)tableR -
                      HANDLE / 2;

                  int minY =
                      (int)tableT -
                      HANDLE / 2;

                  int maxY =
                      (int)tableB -
                      HANDLE / 2;

                  targetLP.x =
                      Math.max(
                          minX,
                          Math.min(
                              maxX,
                              nx
                          )
                      );

                  targetLP.y =
                      Math.max(
                          minY,
                          Math.min(
                              maxY,
                              ny
                          )
                      );

                  wm.updateViewLayout(
                      targetHandle,
                      targetLP
                  );

                  canvas.invalidate();
              }

              private class DragHandle
                  extends View {

                  private final Paint p =
                      new Paint(
                          Paint.ANTI_ALIAS_FLAG
                      );

                  private final boolean target;

                  private float downX;
                  private float downY;

                  private int startX;
                  private int startY;

                  DragHandle(
                      Context c,
                      boolean isTarget
                  ) {

                      super(c);

                      target = isTarget;

                      setBackgroundColor(
                          Color.TRANSPARENT
                      );
                  }

                  @Override
                  protected void onDraw(Canvas c) {

                      /*
                       * Bola putih tidak diberi
                       * lingkaran penanda.
                       */
                      if (!target) {
                          return;
                      }

                      /*
                       * Hanya satu penanda:
                       * bola target.
                       */
                      p.setStyle(
                          Paint.Style.STROKE
                      );

                      p.setStrokeWidth(3);

                      p.setColor(
                          Color.WHITE
                      );

                      c.drawCircle(
                          getWidth()/2f,
                          getHeight()/2f,
                          15,
                          p
                      );
                  }

                  @Override
                  public boolean onTouchEvent(
                      MotionEvent e
                  ) {

                      WindowManager.LayoutParams lp =
                          target
                              ? targetLP
                              : cueLP;

                      if (
                          e.getAction()
                              == MotionEvent.ACTION_DOWN
                      ) {

                          downX =
                              e.getRawX();

                          downY =
                              e.getRawY();

                          startX =
                              lp.x;

                          startY =
                              lp.y;

                          return true;
                      }

                      if (
                          e.getAction()
                              == MotionEvent.ACTION_MOVE
                      ) {

                          int nx =
                              startX +
                              (int)(
                                  e.getRawX()
                                  - downX
                              );

                          int ny =
                              startY +
                              (int)(
                                  e.getRawY()
                                  - downY
                              );

                          int minX =
                              (int)tableL -
                              HANDLE / 2;

                          int maxX =
                              (int)tableR -
                              HANDLE / 2;

                          int minY =
                              (int)tableT -
                              HANDLE / 2;

                          int maxY =
                              (int)tableB -
                              HANDLE / 2;

                          lp.x =
                              Math.max(
                                  minX,
                                  Math.min(
                                      maxX,
                                      nx
                                  )
                              );

                          lp.y =
                              Math.max(
                                  minY,
                                  Math.min(
                                      maxY,
                                      ny
                                  )
                              );

                          wm.updateViewLayout(
                              this,
                              lp
                          );

                          canvas.invalidate();

                          return true;
                      }

                      return true;
                  }
              }

              private class AimCanvas
                  extends View {

                  private final Paint p =
                      new Paint(
                          Paint.ANTI_ALIAS_FLAG
                      );

                  AimCanvas(Context c) {
                      super(c);

                      p.setStrokeCap(
                          Paint.Cap.ROUND
                      );
                  }

                  @Override
                  protected void onDraw(Canvas c) {

                      float cueX =
                          cueLP.x +
                          HANDLE / 2f;

                      float cueY =
                          cueLP.y +
                          HANDLE / 2f;

                      float tx =
                          targetLP.x +
                          HANDLE / 2f;

                      float ty =
                          targetLP.y +
                          HANDLE / 2f;

                      /*
                       * GARIS BIDIK:
                       *
                       * bola putih
                       *       ↓
                       *       ↓
                       * bola target
                       */
                      float vx =
                          tx - cueX;

                      float vy =
                          ty - cueY;

                      float len =
                          (float)Math.hypot(
                              vx,
                              vy
                          );

                      if (len < 1) {
                          return;
                      }

                      float ux =
                          vx / len;

                      float uy =
                          vy / len;

                      /*
                       * Garis putih dari
                       * bola putih ke target.
                       */
                      p.setStyle(
                          Paint.Style.STROKE
                      );

                      p.setStrokeWidth(5);

                      p.setColor(
                          Color.WHITE
                      );

                      c.drawLine(
                          cueX + ux * 16,
                          cueY + uy * 16,
                          tx - ux * 16,
                          ty - uy * 16,
                          p
                      );

                      /*
                       * Garis dari target
                       * menuju pantulan.
                       */
                      float dx =
                          (float)Math.cos(
                              Math.toRadians(
                                  angleDeg
                              )
                          );

                      float dy =
                          (float)Math.sin(
                              Math.toRadians(
                                  angleDeg
                              )
                          );

                      Hit hit =
                          rayHit(
                              tx,
                              ty,
                              dx,
                              dy
                          );

                      p.setColor(
                          Color.rgb(
                              50,
                              240,
                              120
                          )
                      );

                      p.setStrokeWidth(4);

                      c.drawLine(
                          tx,
                          ty,
                          hit.x,
                          hit.y,
                          p
                      );

                      /*
                       * Garis pantulan.
                       */
                      float rdx = dx;
                      float rdy = dy;

                      if (
                          hit.side == 1 ||
                          hit.side == 3
                      ) {
                          rdx = -rdx;
                      }

                      if (
                          hit.side == 2 ||
                          hit.side == 4
                      ) {
                          rdy = -rdy;
                      }

                      Hit second =
                          rayHit(
                              hit.x,
                              hit.y,
                              rdx,
                              rdy
                          );

                      p.setColor(
                          Color.WHITE
                      );

                      p.setStrokeWidth(3);

                      dashed(
                          c,
                          hit.x,
                          hit.y,
                          second.x,
                          second.y,
                          p
                      );

                      /*
                       * PENANDA TARGET SAJA.
                       */
                      p.setColor(
                          Color.WHITE
                      );

                      p.setStrokeWidth(3);

                      c.drawCircle(
                          tx,
                          ty,
                          15,
                          p
                      );
                  }

                  private void dashed(
                      Canvas c,
                      float x1,
                      float y1,
                      float x2,
                      float y2,
                      Paint paint
                  ) {

                      float dx =
                          x2 - x1;

                      float dy =
                          y2 - y1;

                      float len =
                          (float)Math.hypot(
                              dx,
                              dy
                          );

                      if (len < 1) {
                          return;
                      }

                      float ux =
                          dx / len;

                      float uy =
                          dy / len;

                      for (
                          float d = 0;
                          d < len;
                          d += 24
                      ) {

                          float e =
                              Math.min(
                                  d + 12,
                                  len
                              );

                          c.drawLine(
                              x1 + ux*d,
                              y1 + uy*d,
                              x1 + ux*e,
                              y1 + uy*e,
                              paint
                          );
                      }
                  }

                  private Hit rayHit(
                      float x,
                      float y,
                      float dx,
                      float dy
                  ) {

                      float best =
                          Float.MAX_VALUE;

                      float hx = x;
                      float hy = y;

                      int side = 0;

                      if (
                          dx > 0.0001f
                      ) {

                          float t =
                              (tableR-x)/dx;

                          if (
                              t > 0 &&
                              t < best
                          ) {

                              best = t;

                              hx =
                                  x + dx*t;

                              hy =
                                  y + dy*t;

                              side = 3;
                          }
                      }

                      if (
                          dx < -0.0001f
                      ) {

                          float t =
                              (tableL-x)/dx;

                          if (
                              t > 0 &&
                              t < best
                          ) {

                              best = t;

                              hx =
                                  x + dx*t;

                              hy =
                                  y + dy*t;

                              side = 1;
                          }
                      }

                      if (
                          dy > 0.0001f
                      ) {

                          float t =
                              (tableB-y)/dy;

                          if (
                              t > 0 &&
                              t < best
                          ) {

                              best = t;

                              hx =
                                  x + dx*t;

                              hy =
                                  y + dy*t;

                              side = 4;
                          }
                      }

                      if (
                          dy < -0.0001f
                      ) {

                          float t =
                              (tableT-y)/dy;

                          if (
                              t > 0 &&
                              t < best
                          ) {

                              best = t;

                              hx =
                                  x + dx*t;

                              hy =
                                  y + dy*t;

                              side = 2;
                          }
                      }

                      return new Hit(
                          hx,
                          hy,
                          side
                      );
                  }

                  private class Hit {

                      float x;
                      float y;
                      int side;

                      Hit(
                          float xx,
                          float yy,
                          int s
                      ) {

                          x = xx;
                          y = yy;
                          side = s;
                      }
                  }
              }

              private void createChannel() {

                  if (
                      Build.VERSION.SDK_INT >= 26
                  ) {

                      NotificationChannel c =
                          new NotificationChannel(
                              CHANNEL,
                              "Aim Helper",
                              NotificationManager
                                  .IMPORTANCE_LOW
                          );

                      (
                          (NotificationManager)
                          getSystemService(
                              Context.NOTIFICATION_SERVICE
                          )
                      ).createNotificationChannel(c);
                  }
              }

              private Notification notification() {

                  return new Notification.Builder(
                      this,
                      CHANNEL
                  )
                  .setContentTitle(
                      "Aim Helper"
                  )
                  .setContentText(
                      "Bola putih → 1 target → garis bidik"
                  )
                  .setSmallIcon(
                      android.R.drawable.ic_menu_compass
                  )
                  .setOngoing(true)
                  .build();
              }

              @Override
              public void onDestroy() {

                  try {

                      if (canvas != null)
                          wm.removeView(canvas);

                      if (cueHandle != null)
                          wm.removeView(cueHandle);

                      if (targetHandle != null)
                          wm.removeView(targetHandle);

                      if (panel != null)
                          wm.removeView(panel);

                  } catch(Exception ignored) {}

                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent i) {
                  return null;
              }
          }
          JAVA

      - name: Verify project
        run: |
          PROJECT="AimHelper-Native-Overlay-v1"

          test -f "$PROJECT/app/build.gradle"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT/app/src/main/java/com/aimhelper/overlay/MainActivity.java"
          test -f "$PROJECT/app/src/main/java/com/aimhelper/overlay/OverlayService.java"

          grep -q "Bola putih" \
            "$PROJECT/app/src/main/java/com/aimhelper/overlay/OverlayService.java"

          echo "CONFIG OK"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build APK
        run: |
          cd AimHelper-Native-Overlay-v1
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AimHelper-APK-Single-Target
          path: AimHelper-Native-Overlay-v1/app/build/outputs/apk/debug/*.apk
