name: Build Aim Helper APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q AimHelper-Native-Overlay-OnlineBuild.zip

      - name: Configure Android project
        run: |
          PROJECT="AimHelper-Native-Overlay-v1"

          cat > "$PROJECT/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > "$PROJECT/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.aimhelper.overlay'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.aimhelper.overlay'
                  minSdk 23
                  targetSdk 35
                  versionCode 3
                  versionName '1.2'
              }
          }
          EOF

      - name: Configure Manifest
        run: |
          PROJECT="AimHelper-Native-Overlay-v1"

          cat > "$PROJECT/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="Aim Helper"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".OverlayService"
                      android:exported="false" />

              </application>

          </manifest>
          EOF

      - name: Configure MainActivity
        run: |
          PROJECT="AimHelper-Native-Overlay-v1"

          cat > "$PROJECT/app/src/main/java/com/aimhelper/overlay/MainActivity.java" <<'JAVA'
          package com.aimhelper.overlay;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              private int dp(float value) {
                  return (int) (
                      value * getResources()
                          .getDisplayMetrics().density
                  );
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root =
                      new LinearLayout(this);

                  root.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  root.setPadding(
                      dp(24),
                      dp(35),
                      dp(24),
                      dp(24)
                  );

                  root.setBackgroundColor(
                      Color.rgb(5, 20, 28)
                  );

                  TextView title =
                      new TextView(this);

                  title.setText(
                      "🎯 Aim Helper"
                  );

                  title.setTextColor(
                      Color.WHITE
                  );

                  title.setTextSize(34);

                  title.setGravity(
                      Gravity.CENTER
                  );

                  root.addView(
                      title,
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(65)
                      )
                  );

                  TextView subtitle =
                      new TextView(this);

                  subtitle.setText(
                      "Mistar Manual + Pantulan"
                  );

                  subtitle.setTextColor(
                      Color.rgb(170, 195, 210)
                  );

                  subtitle.setTextSize(21);

                  subtitle.setGravity(
                      Gravity.CENTER
                  );

                  root.addView(
                      subtitle,
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(50)
                      )
                  );

                  TextView info =
                      new TextView(this);

                  info.setText(
                      "Geser titik ⚪ dan 🎯 untuk menentukan " +
                      "arah tembakan. Garis putih menunjukkan " +
                      "arah pantulan pada bantalan meja."
                  );

                  info.setTextColor(
                      Color.rgb(205, 220, 228)
                  );

                  info.setTextSize(17);

                  info.setPadding(
                      dp(5),
                      dp(15),
                      dp(5),
                      dp(20)
                  );

                  root.addView(
                      info,
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(125)
                      )
                  );

                  Button permission =
                      new Button(this);

                  permission.setText(
                      "1. Izinkan tampil di atas aplikasi"
                  );

                  permission.setTextSize(16);

                  permission.setOnClickListener(
                      v -> {

                          if (!Settings.canDrawOverlays(
                                  MainActivity.this)) {

                              Intent intent =
                                  new Intent(
                                      Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                      Uri.parse(
                                          "package:" +
                                          getPackageName()
                                      )
                                  );

                              startActivity(intent);
                          }
                      }
                  );

                  root.addView(
                      permission,
                      buttonParams()
                  );

                  Button start =
                      new Button(this);

                  start.setText(
                      "2. Nyalakan Mistar Manual"
                  );

                  start.setTextSize(16);

                  start.setOnClickListener(
                      v -> {

                          if (!Settings.canDrawOverlays(
                                  MainActivity.this)) {

                              return;
                          }

                          Intent intent =
                              new Intent(
                                  MainActivity.this,
                                  OverlayService.class
                              );

                          if (android.os.Build.VERSION.SDK_INT >= 26) {

                              startForegroundService(
                                  intent
                              );

                          } else {

                              startService(intent);
                          }
                      }
                  );

                  root.addView(
                      start,
                      buttonParams()
                  );

                  Button stop =
                      new Button(this);

                  stop.setText(
                      "3. Matikan Mistar"
                  );

                  stop.setTextSize(16);

                  stop.setOnClickListener(
                      v -> {

                          stopService(
                              new Intent(
                                  MainActivity.this,
                                  OverlayService.class
                              )
                          );
                      }
                  );

                  root.addView(
                      stop,
                      buttonParams()
                  );

                  TextView note =
                      new TextView(this);

                  note.setText(
                      "Catatan: fitur ini hanya memberikan " +
                      "panduan visual. Tidak ada auto-click, " +
                      "auto-shot, atau pengendalian permainan."
                  );

                  note.setTextColor(
                      Color.rgb(155, 180, 195)
                  );

                  note.setTextSize(15);

                  note.setPadding(
                      0,
                      dp(30),
                      0,
                      0
                  );

                  root.addView(
                      note,
                      new LinearLayout.LayoutParams(
                          -1,
                          -2
                      )
                  );

                  setContentView(root);
              }

              private LinearLayout.LayoutParams buttonParams() {

                  LinearLayout.LayoutParams p =
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(62)
                      );

                  p.setMargins(
                      0,
                      dp(8),
                      0,
                      dp(8)
                  );

                  return p;
              }
          }
          JAVA

      - name: Configure OverlayService
        run: |
          PROJECT="AimHelper-Native-Overlay-v1"

          cat > "$PROJECT/app/src/main/java/com/aimhelper/overlay/OverlayService.java" <<'JAVA'
          package com.aimhelper.overlay;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.IBinder;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.TextView;

          import java.util.Locale;

          public class OverlayService extends Service {

              private WindowManager wm;

              private AimCanvas canvas;

              private View startHandle;
              private View tipHandle;

              private TextView panel;

              private float startX;
              private float startY;

              private float tipX;
              private float tipY;

              private float tableL;
              private float tableT;
              private float tableR;
              private float tableB;

              private int bounceCount = 1;

              private static final String CHANNEL =
                  "aim_helper_manual";

              @Override
              public void onCreate() {
                  super.onCreate();

                  createChannel();

                  startForeground(
                      9,
                      notification()
                  );

                  wm =
                      (WindowManager)
                      getSystemService(
                          WINDOW_SERVICE
                      );

                  showOverlay();
              }

              private void showOverlay() {

                  if (!Settings.canDrawOverlays(this)) {
                      stopSelf();
                      return;
                  }

                  int w =
                      getResources()
                          .getDisplayMetrics()
                          .widthPixels;

                  int h =
                      getResources()
                          .getDisplayMetrics()
                          .heightPixels;

                  tableL = w * 0.17f;
                  tableR = w * 0.86f;

                  tableT = h * 0.16f;
                  tableB = h * 0.91f;

                  startX = w * 0.56f;
                  startY = h * 0.56f;

                  tipX = w * 0.56f;
                  tipY = h * 0.30f;

                  WindowManager.LayoutParams drawParams =
                      params(
                          -1,
                          -1,
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                      );

                  canvas =
                      new AimCanvas(this);

                  wm.addView(
                      canvas,
                      drawParams
                  );

                  startHandle =
                      handle("⚪");

                  tipHandle =
                      handle("🎯");

                  addHandle(
                      startHandle,
                      startX,
                      startY,
                      true
                  );

                  addHandle(
                      tipHandle,
                      tipX,
                      tipY,
                      false
                  );

                  panel =
                      new TextView(this);

                  panel.setTextColor(
                      Color.WHITE
                  );

                  panel.setTextSize(14);

                  panel.setTypeface(
                      Typeface.DEFAULT,
                      Typeface.BOLD
                  );

                  panel.setGravity(
                      Gravity.CENTER
                  );

                  panel.setPadding(
                      15,
                      10,
                      15,
                      10
                  );

                  panel.setBackground(
                      background(
                          Color.argb(
                              225,
                              8,
                              25,
                              35
                          ),
                          Color.rgb(
                              50,
                              240,
                              120
                          )
                      )
                  );

                  panel.setOnClickListener(
                      v -> {

                          bounceCount++;

                          if (bounceCount > 3) {
                              bounceCount = 1;
                          }

                          update();

                          canvas.invalidate();
                      }
                  );

                  WindowManager.LayoutParams pp =
                      params(
                          320,
                          125,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                      );

                  pp.gravity =
                      Gravity.TOP |
                      Gravity.END;

                  pp.x = 15;
                  pp.y = 65;

                  wm.addView(
                      panel,
                      pp
                  );

                  update();
              }

              private WindowManager.LayoutParams params(
                  int width,
                  int height,
                  int flags
              ) {

                  return new WindowManager.LayoutParams(
                      width,
                      height,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      flags |
                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      android.graphics.PixelFormat.TRANSLUCENT
                  );
              }

              private TextView handle(
                  String text
              ) {

                  TextView v =
                      new TextView(this);

                  v.setText(text);

                  v.setTextSize(27);

                  v.setGravity(
                      Gravity.CENTER
                  );

                  v.setBackground(
                      background(
                          Color.argb(
                              205,
                              15,
                              35,
                              45
                          ),
                          Color.rgb(
                              50,
                              240,
                              120
                          )
                      )
                  );

                  return v;
              }

              private GradientDrawable background(
                  int fill,
                  int stroke
              ) {

                  GradientDrawable d =
                      new GradientDrawable();

                  d.setColor(fill);

                  d.setCornerRadius(25);

                  d.setStroke(
                      4,
                      stroke
                  );

                  return d;
              }

              private void addHandle(
                  View v,
                  float x,
                  float y,
                  boolean isStart
              ) {

                  WindowManager.LayoutParams lp =
                      params(
                          72,
                          72,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                      );

                  lp.gravity =
                      Gravity.TOP |
                      Gravity.START;

                  lp.x = (int)x - 36;
                  lp.y = (int)y - 36;

                  wm.addView(v, lp);

                  v.setTag(lp);

                  v.setOnTouchListener(
                      (view, event) -> {

                          WindowManager.LayoutParams p =
                              (WindowManager.LayoutParams)
                              view.getTag();

                          if (
                              event.getAction() ==
                              MotionEvent.ACTION_DOWN
                          ) {

                              view.setTag(
                                  new Object[]{
                                      p,
                                      event.getRawX(),
                                      event.getRawY(),
                                      p.x,
                                      p.y
                                  }
                              );

                              return true;
                          }

                          if (
                              event.getAction() ==
                              MotionEvent.ACTION_MOVE
                          ) {

                              Object[] data =
                                  (Object[])
                                  view.getTag();

                              WindowManager.LayoutParams original =
                                  (WindowManager.LayoutParams)
                                  data[0];

                              float downX =
                                  (float)data[1];

                              float downY =
                                  (float)data[2];

                              int baseX =
                                  (int)data[3];

                              int baseY =
                                  (int)data[4];

                              original.x =
                                  baseX +
                                  (int)(
                                      event.getRawX() -
                                      downX
                                  );

                              original.y =
                                  baseY +
                                  (int)(
                                      event.getRawY() -
                                      downY
                                  );

                              wm.updateViewLayout(
                                  view,
                                  original
                              );

                              float cx =
                                  original.x + 36;

                              float cy =
                                  original.y + 36;

                              if (isStart) {

                                  startX = cx;
                                  startY = cy;

                              } else {

                                  tipX = cx;
                                  tipY = cy;
                              }

                              canvas.invalidate();

                              update();

                              return true;
                          }

                          return true;
                      }
                  );
              }

              private void update() {

                  if (panel == null) {
                      return;
                  }

                  double angle =
                      Math.toDegrees(
                          Math.atan2(
                              tipY - startY,
                              tipX - startX
                          )
                      );

                  if (angle < 0) {
                      angle += 360;
                  }

                  double distance =
                      Math.hypot(
                          tipX - startX,
                          tipY - startY
                      );

                  panel.setText(
                      "🎯 MISTAR ON\n" +
                      "Sudut: " +
                      String.format(
                          Locale.US,
                          "%.1f°",
                          angle
                      ) +
                      "\nJarak: " +
                      (int)distance +
                      " • Pantulan: " +
                      bounceCount
                  );
              }

              private float[] hit(
                  float x,
                  float y,
                  float dx,
                  float dy
              ) {

                  float best =
                      Float.MAX_VALUE;

                  float hx =
                      x + dx * 10000;

                  float hy =
                      y + dy * 10000;

                  if (dx > 0) {

                      float t =
                          (tableR - x) / dx;

                      if (t > 0 && t < best) {

                          best = t;

                          hx = x + dx * t;
                          hy = y + dy * t;
                      }
                  }

                  if (dx < 0) {

                      float t =
                          (tableL - x) / dx;

                      if (t > 0 && t < best) {

                          best = t;

                          hx = x + dx * t;
                          hy = y + dy * t;
                      }
                  }

                  if (dy > 0) {

                      float t =
                          (tableB - y) / dy;

                      if (t > 0 && t < best) {

                          best = t;

                          hx = x + dx * t;
                          hy = y + dy * t;
                      }
                  }

                  if (dy < 0) {

                      float t =
                          (tableT - y) / dy;

                      if (t > 0 && t < best) {

                          best = t;

                          hx = x + dx * t;
                          hy = y + dy * t;
                      }
                  }

                  return new float[]{
                      hx,
                      hy
                  };
              }

              private void dashed(
                  Canvas c,
                  Paint p,
                  float x1,
                  float y1,
                  float x2,
                  float y2
              ) {

                  float dx = x2 - x1;
                  float dy = y2 - y1;

                  float len =
                      (float)Math.hypot(
                          dx,
                          dy
                      );

                  if (len < 1) {
                      return;
                  }

                  float ux = dx / len;
                  float uy = dy / len;

                  for (
                      float d = 0;
                      d < len;
                      d += 28
                  ) {

                      float e =
                          Math.min(
                              d + 14,
                              len
                          );

                      c.drawLine(
                          x1 + ux * d,
                          y1 + uy * d,
                          x1 + ux * e,
                          y1 + uy * e,
                          p
                      );
                  }
              }

              private class AimCanvas
                  extends View {

                  private final Paint paint =
                      new Paint(
                          Paint.ANTI_ALIAS_FLAG
                      );

                  AimCanvas(Context c) {
                      super(c);

                      paint.setStrokeCap(
                          Paint.Cap.ROUND
                      );
                  }

                  @Override
                  protected void onDraw(
                      Canvas c
                  ) {

                      super.onDraw(c);

                      float dx =
                          tipX - startX;

                      float dy =
                          tipY - startY;

                      float len =
                          (float)Math.hypot(
                              dx,
                              dy
                          );

                      if (len < 2) {
                          return;
                      }

                      dx /= len;
                      dy /= len;

                      paint.setStyle(
                          Paint.Style.STROKE
                      );

                      paint.setStrokeWidth(6);

                      paint.setColor(
                          Color.rgb(
                              50,
                              240,
                              120
                          )
                      );

                      c.drawLine(
                          startX,
                          startY,
                          tipX,
                          tipY,
                          paint
                      );

                      float x = tipX;
                      float y = tipY;

                      for (
                          int i = 0;
                          i < bounceCount;
                          i++
                      ) {

                          float[] h =
                              hit(
                                  x,
                                  y,
                                  dx,
                                  dy
                              );

                          paint.setStrokeWidth(4);

                          paint.setColor(
                              Color.WHITE
                          );

                          dashed(
                              c,
                              paint,
                              x,
                              y,
                              h[0],
                              h[1]
                          );

                          paint.setStrokeWidth(4);

                          paint.setColor(
                              Color.rgb(
                                  255,
                                  210,
                                  50
                              )
                          );

                          c.drawCircle(
                              h[0],
                              h[1],
                              14,
                              paint
                          );

                          boolean side =
                              Math.abs(
                                  h[0] - tableL
                              ) < 3 ||
                              Math.abs(
                                  h[0] - tableR
                              ) < 3;

                          x = h[0];
                          y = h[1];

                          if (side) {
                              dx = -dx;
                          } else {
                              dy = -dy;
                          }
                      }

                      paint.setStrokeWidth(4);

                      paint.setColor(
                          Color.rgb(
                              50,
                              240,
                              120
                          )
                      );

                      c.drawCircle(
                          startX,
                          startY,
                          28,
                          paint
                      );

                      c.drawCircle(
                          tipX,
                          tipY,
                          28,
                          paint
                      );

                      paint.setStyle(
                          Paint.Style.FILL
                      );

                      paint.setTextSize(24);

                      paint.setColor(
                          Color.WHITE
                      );

                      c.drawText(
                          "BIDIK",
                          tipX + 35,
                          tipY,
                          paint
                      );
                  }
              }

              private Notification notification() {

                  return new Notification.Builder(
                      this,
                      CHANNEL
                  )
                  .setContentTitle(
                      "Aim Helper"
                  )
                  .setContentText(
                      "Mistar manual aktif"
                  )
                  .setSmallIcon(
                      android.R.drawable
                          .ic_menu_compass
                  )
                  .setOngoing(true)
                  .build();
              }

              private void createChannel() {

                  if (
                      Build.VERSION.SDK_INT >= 26
                  ) {

                      NotificationChannel ch =
                          new NotificationChannel(
                              CHANNEL,
                              "Aim Helper",
                              NotificationManager
                                  .IMPORTANCE_LOW
                          );

                      NotificationManager nm =
                          (NotificationManager)
                          getSystemService(
                              Context.NOTIFICATION_SERVICE
                          );

                      nm.createNotificationChannel(
                          ch
                      );
                  }
              }

              @Override
              public void onDestroy() {

                  try {

                      if (canvas != null) {
                          wm.removeView(canvas);
                      }

                      if (startHandle != null) {
                          wm.removeView(startHandle);
                      }

                      if (tipHandle != null) {
                          wm.removeView(tipHandle);
                      }

                      if (panel != null) {
                          wm.removeView(panel);
                      }

                  } catch (Exception ignored) {
                  }

                  super.onDestroy();
              }

              @Override
              public IBinder onBind(
                  Intent intent
              ) {
                  return null;
              }
          }
          JAVA

      - name: Build APK
        run: |
          cd AimHelper-Native-Overlay-v1

          chmod +x gradlew 2>/dev/null || true

          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AimHelper-APK-Manual-Ruler
          path: AimHelper-Native-Overlay-v1/app/build/outputs/apk/debug/*.apk
