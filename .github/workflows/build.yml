name: Build Aim Helper APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -q AimHelper-Native-Overlay-OnlineBuild.zip

      - name: Prepare Stage 2 Fixed
        run: |
          # Ambil workflow Stage 2 sebelumnya sebagai template
          curl -L -s \
            https://raw.githubusercontent.com/gunadipanji7-pixel/Aim-Helper/8b7c2d8/.github/workflows/build.yml \
            -o /tmp/stage2-template.yml

          # Perbaiki error RESULT_OK pada OverlayService
          sed -i \
            's/resultCode == RESULT_OK/resultCode == android.app.Activity.RESULT_OK/g' \
            /tmp/stage2-template.yml

          # Ambil script Prepare Stage 2 dari template
          sed -n '20,614p' /tmp/stage2-template.yml \
            | sed 's/^          //' \
            > /tmp/prepare-stage2.sh

          chmod +x /tmp/prepare-stage2.sh
          bash /tmp/prepare-stage2.sh

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build APK
        run: |
          cd AimHelper-Native-Overlay-v1
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AimHelper-APK-Stage2
          path: AimHelper-Native-Overlay-v1/app/build/outputs/apk/debug/*.apk
