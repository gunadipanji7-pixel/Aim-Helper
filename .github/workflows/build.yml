name: Build Aim Helper APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.2.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2.1-bin.zip
          unzip -q gradle-8.2.1-bin.zip
          echo "$PWD/gradle-8.2.1/bin" >> "$GITHUB_PATH"

      - name: Extract Android project
        run: |
          unzip -q AimHelper-Native-Overlay-OnlineBuild.zip
          test -d AimHelper-Native-Overlay-v1

      - name: Prepare clean Android project
        run: |
          PROJECT="AimHelper-Native-Overlay-v1"

          mkdir -p "$PROJECT/app/src/main/java/com/aimhelper/overlay"
          mkdir -p "$PROJECT/app/src/main/res/values"

          find "$PROJECT/app/src/main/java" -type f -name "*.java" -delete
          find "$PROJECT/app/src/main/java" -type f -name "*.kt" -delete

          cat > "$PROJECT/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AimHelper"
          include ":app"
          EOF

          cat > "$PROJECT/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > "$PROJECT/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > "$PROJECT/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.aimhelper.overlay'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.aimhelper.overlay'
                  minSdk 23
                  targetSdk 35
                  versionCode 10
                  versionName '2.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          configurations.configureEach {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

          cat > "$PROJECT/app/src/main/res/values/strings.xml" <<'EOF'
          <resources>
              <string name="app_name">Aim Helper</string>
          </resources>
          EOF

          cat > "$PROJECT/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <application
                  android:allowBackup="false"
                  android:label="Aim Helper"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".OverlayService"
                      android:exported="false" />

              </application>

          </manifest>
          EOF

      - name: Create MainActivity
        run: |
          PROJECT="AimHelper-Native-Overlay-v1"

          cat > "$PROJECT/app/src/main/java/com/aimhelper/overlay/MainActivity.java" <<'EOF'
          package com.aimhelper.overlay;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(30, 35, 30, 30);
                  root.setBackgroundColor(Color.WHITE);

                  TextView title = new TextView(this);
                  title.setText("🎯 Aim Helper");
                  title.setTextSize(28);
                  title.setTextColor(Color.BLACK);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title,
                          new LinearLayout.LayoutParams(-1, 75));

                  TextView info = new TextView(this);
                  info.setText(
                          "MISTAR MANUAL 2.0\\n\\n" +
                          "• Satu penanda target saja\\n" +
                          "• Garis dimulai dari bola putih\\n" +
                          "• Target bisa digeser\\n" +
                          "• Analog menggeser target\\n" +
                          "• Panel bisa dipindahkan\\n" +
                          "• Garis pantulan meja\\n" +
                          "• Tidak ada auto-shot"
                  );
                  info.setTextSize(16);
                  info.setTextColor(Color.DKGRAY);
                  root.addView(info,
                          new LinearLayout.LayoutParams(-1, -2));

                  Button permission = new Button(this);
                  permission.setText("1. IZINKAN OVERLAY");
                  root.addView(permission,
                          new LinearLayout.LayoutParams(-1, 65));

                  Button start = new Button(this);
                  start.setText("2. NYALAKAN AIM HELPER");
                  root.addView(start,
                          new LinearLayout.LayoutParams(-1, 70));

                  Button stop = new Button(this);
                  stop.setText("3. MATIKAN AIM HELPER");
                  root.addView(stop,
                          new LinearLayout.LayoutParams(-1, 70));

                  TextView help = new TextView(this);
                  help.setText(
                          "\\nCara menggunakan:\\n" +
                          "1. Izinkan overlay.\\n" +
                          "2. Nyalakan Aim Helper.\\n" +
                          "3. Buka 8 Ball Pool.\\n" +
                          "4. Geser lingkaran target ke bola yang akan dibidik.\\n" +
                          "5. Gunakan analog untuk koreksi posisi.\\n" +
                          "6. Panel dapat digeser."
                  );
                  help.setTextSize(15);
                  help.setTextColor(Color.DKGRAY);
                  root.addView(help);

                  permission.setOnClickListener(v -> {
                      try {
                          Intent i = new Intent(
                                  Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse("package:" + getPackageName())
                          );
                          startActivity(i);
                      } catch (Exception e) {
                          startActivity(new Intent(
                                  Settings.ACTION_MANAGE_OVERLAY_PERMISSION
                          ));
                      }
                  });

                  start.setOnClickListener(v -> {
                      if (Settings.canDrawOverlays(this)) {
                          startService(new Intent(
                                  this,
                                  OverlayService.class
                          ));
                      } else {
                          permission.performClick();
                      }
                  });

                  stop.setOnClickListener(v -> {
                      stopService(new Intent(
                              this,
                              OverlayService.class
                      ));
                  });

                  setContentView(root);
              }
          }
          EOF

      - name: Create OverlayService
        run: |
          PROJECT="AimHelper-Native-Overlay-v1"

          cat > "$PROJECT/app/src/main/java/com/aimhelper/overlay/OverlayService.java" <<'EOF'
          package com.aimhelper.overlay;

          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.DashPathEffect;
          import android.os.IBinder;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.TextView;

          public class OverlayService extends Service {

              private WindowManager wm;

              private AimCanvas aimCanvas;
              private View targetHandle;
              private View joystick;
              private TextView panel;

              private WindowManager.LayoutParams canvasParams;
              private WindowManager.LayoutParams targetParams;
              private WindowManager.LayoutParams joystickParams;
              private WindowManager.LayoutParams panelParams;

              private float targetX = 0.63f;
              private float targetY = 0.43f;

              private float whiteX = 0.38f;
              private float whiteY = 0.58f;

              private float tableL;
              private float tableR;
              private float tableT;
              private float tableB;

              private int bounceCount = 1;

              @Override
              public void onCreate() {
                  super.onCreate();

                  if (!Settings.canDrawOverlays(this)) {
                      stopSelf();
                      return;
                  }

                  wm = (WindowManager)
                          getSystemService(WINDOW_SERVICE);

                  createCanvas();
                  createTarget();
                  createJoystick();
                  createPanel();
              }

              private int overlayType() {
                  return WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY;
              }

              private void createCanvas() {

                  aimCanvas = new AimCanvas();

                  canvasParams =
                          new WindowManager.LayoutParams(
                                  -1,
                                  -1,
                                  overlayType(),
                                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE |
                                  WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE |
                                  WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                                  -3
                          );

                  canvasParams.gravity =
                          Gravity.TOP | Gravity.LEFT;

                  wm.addView(
                          aimCanvas,
                          canvasParams
                  );
              }

              private void createTarget() {

                  targetHandle = new TargetView();

                  targetParams =
                          new WindowManager.LayoutParams(
                                  58,
                                  58,
                                  overlayType(),
                                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                                  -3
                          );

                  targetParams.gravity =
                          Gravity.TOP | Gravity.LEFT;

                  updateTargetPosition();

                  wm.addView(
                          targetHandle,
                          targetParams
                  );
              }

              private void updateTargetPosition() {

                  if (targetParams == null ||
                      targetHandle == null) {
                      return;
                  }

                  int w = aimCanvas.getWidth();
                  int h = aimCanvas.getHeight();

                  if (w <= 0 || h <= 0) {
                      return;
                  }

                  targetParams.x =
                          (int)(w * targetX) - 29;

                  targetParams.y =
                          (int)(h * targetY) - 29;

                  try {
                      wm.updateViewLayout(
                              targetHandle,
                              targetParams
                      );
                  } catch (Exception ignored) {
                  }
              }

              private void createJoystick() {

                  joystick = new JoystickView();

                  joystickParams =
                          new WindowManager.LayoutParams(
                                  150,
                                  150,
                                  overlayType(),
                                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                                  -3
                          );

                  joystickParams.gravity =
                          Gravity.TOP | Gravity.LEFT;

                  joystickParams.x = 35;
                  joystickParams.y = 650;

                  wm.addView(
                          joystick,
                          joystickParams
                  );
              }

              private void createPanel() {

                  panel = new TextView(this);

                  panel.setText(
                          "🎯 AIM HELPER\\n" +
                          "TARGET  •  ANALOG\\n" +
                          "PANTUL: 1x"
                  );

                  panel.setTextColor(Color.WHITE);
                  panel.setTextSize(13);
                  panel.setGravity(Gravity.CENTER);
                  panel.setPadding(15, 10, 15, 10);
                  panel.setBackgroundColor(
                          Color.argb(195, 25, 25, 25)
                  );

                  panelParams =
                          new WindowManager.LayoutParams(
                                  250,
                                  100,
                                  overlayType(),
                                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                                  -3
                          );

                  panelParams.gravity =
                          Gravity.TOP | Gravity.RIGHT;

                  panelParams.x = 20;
                  panelParams.y = 80;

                  panel.setOnTouchListener(
                          new View.OnTouchListener() {

                              float downX;
                              float downY;
                              int startX;
                              int startY;

                              @Override
                              public boolean onTouch(
                                      View v,
                                      MotionEvent e) {

                                  if (e.getAction() ==
                                          MotionEvent.ACTION_DOWN) {

                                      downX = e.getRawX();
                                      downY = e.getRawY();

                                      startX = panelParams.x;
                                      startY = panelParams.y;

                                      return true;
                                  }

                                  if (e.getAction() ==
                                          MotionEvent.ACTION_MOVE) {

                                      panelParams.x =
                                              startX +
                                              (int)(
                                                      e.getRawX() -
                                                      downX
                                              );

                                      panelParams.y =
                                              startY +
                                              (int)(
                                                      e.getRawY() -
                                                      downY
                                              );

                                      wm.updateViewLayout(
                                              panel,
                                              panelParams
                                      );

                                      return true;
                                  }

                                  return true;
                              }
                          }
                  );

                  wm.addView(
                          panel,
                          panelParams
                  );
              }

              private class TargetView extends View {

                  Paint p =
                          new Paint(Paint.ANTI_ALIAS_FLAG);

                  float downX;
                  float downY;
                  float startX;
                  float startY;

                  TargetView() {
                      super(OverlayService.this);
                  }

                  @Override
                  protected void onDraw(Canvas c) {

                      super.onDraw(c);

                      float cx = getWidth() / 2f;
                      float cy = getHeight() / 2f;

                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(3);
                      p.setColor(Color.WHITE);
                      p.setAlpha(230);

                      c.drawCircle(
                              cx,
                              cy,
                              17,
                              p
                      );

                      p.setColor(Color.GREEN);
                      p.setAlpha(170);

                      c.drawCircle(
                              cx,
                              cy,
                              25,
                              p
                      );
                  }

                  @Override
                  public boolean onTouchEvent(
                          MotionEvent e) {

                      if (e.getAction() ==
                              MotionEvent.ACTION_DOWN) {

                          downX = e.getRawX();
                          downY = e.getRawY();

                          startX = targetX;
                          startY = targetY;

                          return true;
                      }

                      if (e.getAction() ==
                              MotionEvent.ACTION_MOVE) {

                          int w = aimCanvas.getWidth();
                          int h = aimCanvas.getHeight();

                          if (w <= 0 || h <= 0) {
                              return true;
                          }

                          targetX =
                                  startX +
                                  (e.getRawX() - downX) /
                                  w;

                          targetY =
                                  startY +
                                  (e.getRawY() - downY) /
                                  h;

                          targetX =
                                  clamp(
                                          targetX,
                                          tableL / w,
                                          tableR / w
                                  );

                          targetY =
                                  clamp(
                                          targetY,
                                          tableT / h,
                                          tableB / h
                                  );

                          updateTargetPosition();
                          aimCanvas.invalidate();

                          return true;
                      }

                      return true;
                  }
              }

              private class JoystickView extends View {

                  Paint p =
                          new Paint(Paint.ANTI_ALIAS_FLAG);

                  float downX;
                  float downY;

                  JoystickView() {
                      super(OverlayService.this);
                  }

                  @Override
                  protected void onDraw(Canvas c) {

                      super.onDraw(c);

                      float cx =
                              getWidth() / 2f;

                      float cy =
                              getHeight() / 2f;

                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(3);
                      p.setColor(Color.WHITE);
                      p.setAlpha(160);

                      c.drawCircle(
                              cx,
                              cy,
                              55,
                              p
                      );

                      p.setStyle(Paint.Style.FILL);
                      p.setColor(
                              Color.argb(
                                      105,
                                      0,
                                      255,
                                      0
                              )
                      );

                      c.drawCircle(
                              cx,
                              cy,
                              32,
                              p
                      );

                      p.setColor(Color.WHITE);
                      p.setAlpha(230);

                      c.drawCircle(
                              cx,
                              cy,
                              13,
                              p
                      );
                  }

                  @Override
                  public boolean onTouchEvent(
                          MotionEvent e) {

                      if (e.getAction() ==
                              MotionEvent.ACTION_DOWN) {

                          downX = e.getRawX();
                          downY = e.getRawY();

                          return true;
                      }

                      if (e.getAction() ==
                              MotionEvent.ACTION_MOVE) {

                          int w =
                                  aimCanvas.getWidth();

                          int h =
                                  aimCanvas.getHeight();

                          if (w <= 0 || h <= 0) {
                              return true;
                          }

                          float dx =
                                  e.getRawX() - downX;

                          float dy =
                                  e.getRawY() - downY;

                          targetX +=
                                  (dx / w) * 1.5f;

                          targetY +=
                                  (dy / h) * 1.5f;

                          targetX =
                                  clamp(
                                          targetX,
                                          tableL / w,
                                          tableR / w
                                  );

                          targetY =
                                  clamp(
                                          targetY,
                                          tableT / h,
                                          tableB / h
                                  );

                          downX = e.getRawX();
                          downY = e.getRawY();

                          updateTargetPosition();
                          aimCanvas.invalidate();

                          return true;
                      }

                      return true;
                  }
              }

              private class AimCanvas extends View {

                  Paint solid =
                          new Paint(Paint.ANTI_ALIAS_FLAG);

                  Paint dashed =
                          new Paint(Paint.ANTI_ALIAS_FLAG);

                  AimCanvas() {
                      super(OverlayService.this);

                      dashed.setStyle(
                              Paint.Style.STROKE
                      );

                      dashed.setStrokeWidth(4);

                      dashed.setPathEffect(
                              new DashPathEffect(
                                      new float[]{
                                              18,
                                              14
                                      },
                                      0
                              )
                      );
                  }

                  @Override
                  protected void onDraw(Canvas c) {

                      super.onDraw(c);

                      float w = getWidth();
                      float h = getHeight();

                      tableL = w * 0.17f;
                      tableR = w * 0.86f;
                      tableT = h * 0.16f;
                      tableB = h * 0.91f;

                      float sx =
                              w * whiteX;

                      float sy =
                              h * whiteY;

                      float tx =
                              w * targetX;

                      float ty =
                              h * targetY;

                      drawMainLine(
                              c,
                              sx,
                              sy,
                              tx,
                              ty
                      );

                      drawBounceLine(
                              c,
                              tx,
                              ty,
                              tx - sx,
                              ty - sy
                      );
                  }

                  private void drawMainLine(
                          Canvas c,
                          float sx,
                          float sy,
                          float tx,
                          float ty) {

                      solid.setStyle(
                              Paint.Style.STROKE
                      );

                      solid.setStrokeWidth(5);
                      solid.setColor(Color.WHITE);
                      solid.setAlpha(230);

                      c.drawLine(
                              sx,
                              sy,
                              tx,
                              ty,
                              solid
                      );
                  }

                  private void drawBounceLine(
                          Canvas c,
                          float x,
                          float y,
                          float dx,
                          float dy) {

                      if (Math.abs(dx) < 0.001f &&
                          Math.abs(dy) < 0.001f) {
                          return;
                      }

                      Path path = new Path();

                      path.moveTo(x, y);

                      for (int i = 0;
                           i < bounceCount;
                           i++) {

                          float bestT =
                                  Float.MAX_VALUE;

                          int hit = 0;

                          if (dx > 0) {

                              float t =
                                      (tableR - x) /
                                      dx;

                              if (t > 0 &&
                                  t < bestT) {
                                  bestT = t;
                                  hit = 1;
                              }

                          } else if (dx < 0) {

                              float t =
                                      (tableL - x) /
                                      dx;

                              if (t > 0 &&
                                  t < bestT) {
                                  bestT = t;
                                  hit = 1;
                              }
                          }

                          if (dy > 0) {

                              float t =
                                      (tableB - y) /
                                      dy;

                              if (t > 0 &&
                                  t < bestT) {
                                  bestT = t;
                                  hit = 2;
                              }

                          } else if (dy < 0) {

                              float t =
                                      (tableT - y) /
                                      dy;

                              if (t > 0 &&
                                  t < bestT) {
                                  bestT = t;
                                  hit = 2;
                              }
                          }

                          if (bestT ==
                                  Float.MAX_VALUE) {
                              break;
                          }

                          float nx =
                                  x + dx * bestT;

                          float ny =
                                  y + dy * bestT;

                          nx =
                                  clamp(
                                          nx,
                                          tableL,
                                          tableR
                                  );

                          ny =
                                  clamp(
                                          ny,
                                          tableT,
                                          tableB
                                  );

                          path.lineTo(nx, ny);

                          if (hit == 1) {
                              dx = -dx;
                          } else if (hit == 2) {
                              dy = -dy;
                          }

                          x = nx;
                          y = ny;
                      }

                      path.lineTo(
                              clamp(
                                      x + dx * 0.7f,
                                      tableL,
                                      tableR
                              ),
                              clamp(
                                      y + dy * 0.7f,
                                      tableT,
                                      tableB
                              )
                      );

                      dashed.setColor(
                              Color.WHITE
                      );

                      dashed.setAlpha(220);

                      c.drawPath(
                              path,
                              dashed
                      );
                  }

                  private float clamp(
                          float value,
                          float min,
                          float max) {

                      return Math.max(
                              min,
                              Math.min(
                                      max,
                                      value
                              )
                      );
                  }
              }

              private float clamp(
                      float value,
                      float min,
                      float max) {

                  return Math.max(
                          min,
                          Math.min(
                                  max,
                                  value
                          )
                  );
              }

              @Override
              public int onStartCommand(
                      Intent intent,
                      int flags,
                      int startId) {

                  return START_STICKY;
              }

              @Override
              public void onDestroy() {

                  try {
                      if (panel != null)
                          wm.removeView(panel);
                  } catch (Exception ignored) {
                  }

                  try {
                      if (joystick != null)
                          wm.removeView(joystick);
                  } catch (Exception ignored) {
                  }

                  try {
                      if (targetHandle != null)
                          wm.removeView(targetHandle);
                  } catch (Exception ignored) {
                  }

                  try {
                      if (aimCanvas != null)
                          wm.removeView(aimCanvas);
                  } catch (Exception ignored) {
                  }

                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

      - name: Verify project
        run: |
          cd AimHelper-Native-Overlay-v1
          gradle --version
          gradle tasks --no-daemon

      - name: Clean
        run: |
          cd AimHelper-Native-Overlay-v1
          gradle clean --no-daemon

      - name: Build APK
        run: |
          cd AimHelper-Native-Overlay-v1
          gradle assembleDebug --no-daemon --stacktrace

      - name: Check APK
        run: |
          test -f AimHelper-Native-Overlay-v1/app/build/outputs/apk/debug/app-debug.apk
          ls -lh AimHelper-Native-Overlay-v1/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AimHelper-APK-v2
          path: AimHelper-Native-Overlay-v1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
