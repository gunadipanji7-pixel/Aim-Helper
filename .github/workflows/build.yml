name: Build Aim Helper APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -q AimHelper-Native-Overlay-OnlineBuild.zip

      - name: Prepare Aim Helper
        run: |
          PROJECT="AimHelper-Native-Overlay-v1"

          printf '%s\n' \
            'android.useAndroidX=true' \
            'android.enableJetifier=true' \
            > "$PROJECT/gradle.properties"

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "AimHelper-Native-Overlay-v1/app/src/main/java/"
              "com/aimhelper/overlay/OverlayService.java"
          )

          p.write_text(r'''package com.aimhelper.overlay;

import android.app.Notification;
import android.app.NotificationChannel;
import android.app.NotificationManager;
import android.app.Service;
import android.content.Context;
import android.content.Intent;
import android.graphics.Canvas;
import android.graphics.Color;
import android.graphics.Paint;
import android.graphics.Typeface;
import android.os.Build;
import android.os.IBinder;
import android.provider.Settings;
import android.view.Gravity;
import android.view.MotionEvent;
import android.view.View;
import android.view.WindowManager;
import android.widget.LinearLayout;
import android.widget.TextView;

public class OverlayService extends Service {

    private WindowManager wm;
    private AimCanvas canvas;

    private View cueHandle;
    private View targetHandle;
    private View panel;

    private WindowManager.LayoutParams cueParams;
    private WindowManager.LayoutParams targetParams;

    private float angleDeg = -8f;

    private static final String CHANNEL = "aim_helper_overlay";
    private static final int HANDLE = 64;

    @Override
    public void onCreate() {
        super.onCreate();

        createChannel();
        startForeground(7, buildNotification());

        wm = (WindowManager) getSystemService(WINDOW_SERVICE);

        showOverlay();
    }

    private int W() {
        return wm.getDefaultDisplay().getWidth();
    }

    private int H() {
        return wm.getDefaultDisplay().getHeight();
    }

    /*
     * Batas meja 8 Ball Pool.
     * Bisa disesuaikan lagi setelah melihat screenshot hasil build.
     */
    private float tableL() {
        return W() * 0.17f;
    }

    private float tableR() {
        return W() * 0.87f;
    }

    private float tableT() {
        return H() * 0.15f;
    }

    private float tableB() {
        return H() * 0.98f;
    }

    private void showOverlay() {

        if (!Settings.canDrawOverlays(this)) {
            stopSelf();
            return;
        }

        WindowManager.LayoutParams draw =
                new WindowManager.LayoutParams(
                        -1,
                        -1,
                        WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                        WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                                | WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                        android.graphics.PixelFormat.TRANSLUCENT
                );

        draw.gravity = Gravity.TOP | Gravity.START;

        canvas = new AimCanvas(this);

        wm.addView(canvas, draw);

        /*
         * Posisi awal bola putih dan bola target.
         */
        float cx = W() * 0.45f;
        float cy = H() * 0.57f;

        float tx = W() * 0.58f;
        float ty = H() * 0.57f;

        cueParams = handleParams((int) cx, (int) cy);
        targetParams = handleParams((int) tx, (int) ty);

        cueHandle = new HandleView(this, false);
        targetHandle = new HandleView(this, true);

        wm.addView(cueHandle, cueParams);
        wm.addView(targetHandle, targetParams);

        panel = makePanel();

        WindowManager.LayoutParams pp =
                new WindowManager.LayoutParams(
                        330,
                        150,
                        WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                        WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                        android.graphics.PixelFormat.TRANSLUCENT
                );

        pp.gravity = Gravity.TOP | Gravity.END;
        pp.x = 12;
        pp.y = 70;

        wm.addView(panel, pp);
    }

    private WindowManager.LayoutParams handleParams(int x, int y) {

        WindowManager.LayoutParams p =
                new WindowManager.LayoutParams(
                        HANDLE,
                        HANDLE,
                        WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                        WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                        android.graphics.PixelFormat.TRANSLUCENT
                );

        p.gravity = Gravity.TOP | Gravity.START;

        p.x = x - HANDLE / 2;
        p.y = y - HANDLE / 2;

        return p;
    }

    private TextView button(String text) {

        TextView b = new TextView(this);

        b.setText(text);
        b.setTextColor(Color.WHITE);
        b.setTextSize(18);
        b.setGravity(Gravity.CENTER);

        b.setTypeface(
                Typeface.DEFAULT,
                Typeface.BOLD
        );

        b.setPadding(8, 2, 8, 2);

        return b;
    }

    private View makePanel() {

        LinearLayout root = new LinearLayout(this);

        root.setOrientation(LinearLayout.VERTICAL);
        root.setPadding(8, 6, 8, 6);

        root.setBackgroundResource(
                R.drawable.panel_bg
        );

        TextView title =
                button("MISTAR ON • 1 TARGET");

        title.setTextSize(15);

        root.addView(
                title,
                new LinearLayout.LayoutParams(
                        -1,
                        40
                )
        );

        LinearLayout row =
                new LinearLayout(this);

        row.setGravity(Gravity.CENTER);

        TextView up = button("↑");
        TextView left = button("←");
        TextView right = button("→");
        TextView down = button("↓");
        TextView rotL = button("↶");
        TextView rotR = button("↷");

        TextView[] buttons = {
                up,
                left,
                right,
                down,
                rotL,
                rotR
        };

        for (TextView b : buttons) {

            row.addView(
                    b,
                    new LinearLayout.LayoutParams(
                            48,
                            48
                    )
            );
        }

        root.addView(row);

        up.setOnClickListener(
                v -> moveTarget(0, -14)
        );

        down.setOnClickListener(
                v -> moveTarget(0, 14)
        );

        left.setOnClickListener(
                v -> moveTarget(-14, 0)
        );

        right.setOnClickListener(
                v -> moveTarget(14, 0)
        );

        rotL.setOnClickListener(
                v -> {
                    angleDeg -= 2;
                    canvas.invalidate();
                }
        );

        rotR.setOnClickListener(
                v -> {
                    angleDeg += 2;
                    canvas.invalidate();
                }
        );

        return root;
    }

    /*
     * Tombol arah hanya menggerakkan bola target.
     */
    private void moveTarget(int dx, int dy) {

        int nx = targetParams.x + dx;
        int ny = targetParams.y + dy;

        int minX =
                (int) tableL() - HANDLE / 2;

        int maxX =
                (int) tableR() - HANDLE / 2;

        int minY =
                (int) tableT() - HANDLE / 2;

        int maxY =
                (int) tableB() - HANDLE / 2;

        targetParams.x =
                Math.max(
                        minX,
                        Math.min(maxX, nx)
                );

        targetParams.y =
                Math.max(
                        minY,
                        Math.min(maxY, ny)
                );

        wm.updateViewLayout(
                targetHandle,
                targetParams
        );

        canvas.invalidate();
    }

    private Notification buildNotification() {

        return new Notification.Builder(
                this,
                CHANNEL
        )
                .setContentTitle("Aim Helper")
                .setContentText(
                        "Bola putih → target → garis bidik"
                )
                .setSmallIcon(
                        android.R.drawable.ic_menu_compass
                )
                .setOngoing(true)
                .build();
    }

    private void createChannel() {

        if (Build.VERSION.SDK_INT >= 26) {

            NotificationChannel c =
                    new NotificationChannel(
                            CHANNEL,
                            "Aim Helper Overlay",
                            NotificationManager.IMPORTANCE_LOW
                    );

            ((NotificationManager)
                    getSystemService(
                            Context.NOTIFICATION_SERVICE
                    ))
                    .createNotificationChannel(c);
        }
    }

    @Override
    public void onDestroy() {

        super.onDestroy();

        if (wm != null) {

            if (canvas != null)
                wm.removeView(canvas);

            if (cueHandle != null)
                wm.removeView(cueHandle);

            if (targetHandle != null)
                wm.removeView(targetHandle);

            if (panel != null)
                wm.removeView(panel);
        }
    }

    @Override
    public IBinder onBind(Intent i) {
        return null;
    }

    /*
     * Handle bola.
     *
     * Bola putih:
     * - tidak diberi lingkaran
     * - hanya menjadi titik awal garis
     *
     * Bola target:
     * - hanya satu penanda
     * - transparan
     */
    private class HandleView extends View {

        Paint p =
                new Paint(Paint.ANTI_ALIAS_FLAG);

        boolean isTarget;

        float downX;
        float downY;

        int startX;
        int startY;

        HandleView(
                Context c,
                boolean target
        ) {

            super(c);

            isTarget = target;

            setBackgroundColor(
                    Color.TRANSPARENT
            );
        }

        @Override
        protected void onDraw(Canvas c) {

            super.onDraw(c);

            /*
             * Bola putih tidak diberi penanda.
             */
            if (!isTarget) {
                return;
            }

            /*
             * Hanya satu lingkaran transparan
             * untuk bola target.
             */
            p.setStyle(Paint.Style.STROKE);
            p.setStrokeWidth(3);
            p.setColor(Color.WHITE);

            c.drawCircle(
                    getWidth() / 2f,
                    getHeight() / 2f,
                    15,
                    p
            );

            p.setStrokeWidth(1.5f);
            p.setColor(Color.LTGRAY);

            c.drawCircle(
                    getWidth() / 2f,
                    getHeight() / 2f,
                    12,
                    p
            );
        }

        @Override
        public boolean onTouchEvent(
                MotionEvent e
        ) {

            WindowManager.LayoutParams lp =
                    (this == cueHandle)
                            ? cueParams
                            : targetParams;

            if (
                    e.getAction()
                            == MotionEvent.ACTION_DOWN
            ) {

                downX = e.getRawX();
                downY = e.getRawY();

                startX = lp.x;
                startY = lp.y;

                return true;
            }

            if (
                    e.getAction()
                            == MotionEvent.ACTION_MOVE
            ) {

                int nx =
                        (int)
                                (
                                        startX
                                                + e.getRawX()
                                                - downX
                                );

                int ny =
                        (int)
                                (
                                        startY
                                                + e.getRawY()
                                                - downY
                                );

                int minX =
                        (int) tableL()
                                - HANDLE / 2;

                int maxX =
                        (int) tableR()
                                - HANDLE / 2;

                int minY =
                        (int) tableT()
                                - HANDLE / 2;

                int maxY =
                        (int) tableB()
                                - HANDLE / 2;

                lp.x =
                        Math.max(
                                minX,
                                Math.min(maxX, nx)
                        );

                lp.y =
                        Math.max(
                                minY,
                                Math.min(maxY, ny)
                        );

                wm.updateViewLayout(
                        this,
                        lp
                );

                canvas.invalidate();

                return true;
            }

            return true;
        }
    }

    /*
     * Canvas untuk garis bidik.
     */
    private class AimCanvas extends View {

        Paint p =
                new Paint(Paint.ANTI_ALIAS_FLAG);

        AimCanvas(Context c) {

            super(c);

            p.setStrokeCap(
                    Paint.Cap.ROUND
            );
        }

        @Override
        protected void onDraw(Canvas c) {

            super.onDraw(c);

            float cueX =
                    cueParams.x
                            + HANDLE / 2f;

            float cueY =
                    cueParams.y
                            + HANDLE / 2f;

            float tx =
                    targetParams.x
                            + HANDLE / 2f;

            float ty =
                    targetParams.y
                            + HANDLE / 2f;

            /*
             * Arah garis bidik dihitung dari
             * bola putih ke bola target.
             */
            float vx = tx - cueX;
            float vy = ty - cueY;

            float len =
                    (float)
                            Math.hypot(
                                    vx,
                                    vy
                            );

            if (len > 1) {

                float ux = vx / len;
                float uy = vy / len;

                /*
                 * Garis berhenti sedikit sebelum
                 * tepi kedua bola.
                 */
                float start = 15f;
                float end = 15f;

                p.setStyle(
                        Paint.Style.STROKE
                );

                p.setStrokeWidth(4);

                p.setColor(
                        Color.WHITE
                );

                c.drawLine(
                        cueX + ux * start,
                        cueY + uy * start,
                        tx - ux * end,
                        ty - uy * end,
                        p
                );
            }

            /*
             * Garis hijau dari target ke
             * titik pantul.
             */
            float dx =
                    (float)
                            Math.cos(
                                    Math.toRadians(
                                            angleDeg
                                    )
                            );

            float dy =
                    (float)
                            Math.sin(
                                    Math.toRadians(
                                            angleDeg
                                    )
                            );

            Hit hit =
                    rayHit(
                            tx,
                            ty,
                            dx,
                            dy
                    );

            float bx = hit.x;
            float by = hit.y;

            p.setColor(
                    Color.rgb(
                            57,
                            242,
                            122
                    )
            );

            p.setStrokeWidth(3);

            c.drawLine(
                    tx,
                    ty,
                    bx,
                    by,
                    p
            );

            /*
             * Pantulan kedua.
             */
            float rdx = dx;
            float rdy = dy;

            if (
                    hit.side == 1
                            || hit.side == 3
            ) {
                rdx = -rdx;
            }

            if (
                    hit.side == 2
                            || hit.side == 4
            ) {
                rdy = -rdy;
            }

            float[] second =
                    rayToTable(
                            bx,
                            by,
                            rdx,
                            rdy
                    );

            p.setColor(
                    Color.WHITE
            );

            p.setStrokeWidth(3);

            drawDashed(
                    c,
                    bx,
                    by,
                    second[0],
                    second[1],
                    p
            );

            /*
             * Titik pantul.
             */
            p.setStyle(
                    Paint.Style.STROKE
            );

            p.setStrokeWidth(2);

            p.setColor(
                    Color.YELLOW
            );

            c.drawCircle(
                    bx,
                    by,
                    10,
                    p
            );

            /*
             * Hanya target yang diberi
             * lingkaran penanda.
             */
            p.setColor(
                    Color.WHITE
            );

            c.drawCircle(
                    tx,
                    ty,
                    15,
                    p
            );
        }

        private void drawDashed(
                Canvas c,
                float x1,
                float y1,
                float x2,
                float y2,
                Paint p
        ) {

            float dx = x2 - x1;
            float dy = y2 - y1;

            float len =
                    (float)
                            Math.hypot(
                                    dx,
                                    dy
                            );

            if (len < 1)
                return;

            float ux = dx / len;
            float uy = dy / len;

            for (
                    float d = 0;
                    d < len;
                    d += 24
            ) {

                c.drawLine(
                        x1 + ux * d,
                        y1 + uy * d,
                        x1
                                + ux
                                * Math.min(
                                        d + 12,
                                        len
                                ),
                        y1
                                + uy
                                * Math.min(
                                        d + 12,
                                        len
                                ),
                        p
                );
            }
        }

        private class Hit {

            float x;
            float y;
            int side;

            Hit(
                    float x,
                    float y,
                    int side
            ) {

                this.x = x;
                this.y = y;
                this.side = side;
            }
        }

        private Hit rayHit(
                float x,
                float y,
                float dx,
                float dy
        ) {

            float best =
                    Float.MAX_VALUE;

            float bx = x;
            float by = y;

            int side = 0;

            if (
                    Math.abs(dx)
                            > 0.0001f
            ) {

                float t =
                        (tableL() - x)
                                / dx;

                if (
                        t > 0
                                && t < best
                                && y + dy * t
                                >= tableT()
                                && y + dy * t
                                <= tableB()
                ) {

                    best = t;

                    bx = tableL();
                    by = y + dy * t;

                    side = 1;
                }

                t =
                        (tableR() - x)
                                / dx;

                if (
                        t > 0
                                && t < best
                                && y + dy * t
                                >= tableT()
                                && y + dy * t
                                <= tableB()
                ) {

                    best = t;

                    bx = tableR();
                    by = y + dy * t;

                    side = 3;
                }
            }

            if (
                    Math.abs(dy)
                            > 0.0001f
            ) {

                float t =
                        (tableT() - y)
                                / dy;

                if (
                        t > 0
                                && t < best
                                && x + dx * t
                                >= tableL()
                                && x + dx * t
                                <= tableR()
                ) {

                    best = t;

                    bx = x + dx * t;
                    by = tableT();

                    side = 2;
                }

                t =
                        (tableB() - y)
                                / dy;

                if (
                        t > 0
                                && t < best
                                && x + dx * t
                                >= tableL()
                                && x + dx * t
                                <= tableR()
                ) {

                    best = t;

                    bx = x + dx * t;
                    by = tableB();

                    side = 4;
                }
            }

            return new Hit(
                    bx,
                    by,
                    side
            );
        }

        private float[] rayToTable(
                float x,
                float y,
                float dx,
                float dy
        ) {

            Hit h =
                    rayHit(
                            x,
                            y,
                            dx,
                            dy
                    );

            return new float[]{
                    h.x,
                    h.y
            };
        }
    }
}
''')
          PY

      - name: Verify project
        run: |
          test -f AimHelper-Native-Overlay-v1/app/build.gradle
          test -f AimHelper-Native-Overlay-v1/app/src/main/AndroidManifest.xml
          test -f AimHelper-Native-Overlay-v1/app/src/main/java/com/aimhelper/overlay/OverlayService.java
          grep -q "MISTAR ON" AimHelper-Native-Overlay-v1/app/src/main/java/com/aimhelper/overlay/OverlayService.java
          echo "White Ball + Single Target + Aim Line OK"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build APK
        run: |
          cd AimHelper-Native-Overlay-v1
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AimHelper-APK-WhiteBall-Target-Line
          path: AimHelper-Native-Overlay-v1/app/build/outputs/apk/debug/*.apk
