name: Build Aim Helper APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -q AimHelper-Native-Overlay-OnlineBuild.zip

      - name: Prepare Stage 2
        run: |
          curl -L -s https://raw.githubusercontent.com/gunadipanji7-pixel/Aim-Helper/8b7c2d8/.github/workflows/build.yml -o /tmp/stage2-template.yml
          ruby -ryaml -e '
            y = YAML.load_file("/tmp/stage2-template.yml")
            s = y["jobs"]["build"]["steps"].find { |x| x["name"] == "Prepare Stage 2" }["run"]
            s = s.lines[1..-1].join
            s = s.gsub("resultCode == RESULT_OK", "resultCode == android.app.Activity.RESULT_OK")
            File.write("/tmp/prepare-stage2.sh", s)
          '
          chmod +x /tmp/prepare-stage2.sh
          bash /tmp/prepare-stage2.sh

      - name: Fix OverlayService
        run: |
          FILE="AimHelper-Native-Overlay-v1/app/src/main/java/com/aimhelper/overlay/OverlayService.java"
          test -f "$FILE"
          sed -i 's/resultCode == RESULT_OK/resultCode == android.app.Activity.RESULT_OK/g' "$FILE"
          grep -n "resultCode.*RESULT_OK" "$FILE" || true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build APK
        run: |
          cd AimHelper-Native-Overlay-v1
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AimHelper-APK-Stage2
          path: AimHelper-Native-Overlay-v1/app/build/outputs/apk/debug/*.apk
