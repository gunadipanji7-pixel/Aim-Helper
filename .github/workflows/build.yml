name: Build Aim Helper APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q AimHelper-Native-Overlay-OnlineBuild.zip

      - name: Configure AndroidX
        run: |
          PROJECT="AimHelper-Native-Overlay-v1"

          cat > "$PROJECT/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > "$PROJECT/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.aimhelper.overlay'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.aimhelper.overlay'
                  minSdk 23
                  targetSdk 35
                  versionCode 5
                  versionName '1.4'
              }
          }
          EOF

      - name: Configure Manifest
        run: |
          PROJECT="AimHelper-Native-Overlay-v1"

          cat > "$PROJECT/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE" />

              <uses-permission
                  android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="Aim Helper"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:stopWithTask="false" />

              </application>

          </manifest>
          EOF

      - name: Configure MainActivity
        run: |
          PROJECT="AimHelper-Native-Overlay-v1"

          cat > "$PROJECT/app/src/main/java/com/aimhelper/overlay/MainActivity.java" <<'JAVA'
          package com.aimhelper.overlay;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              private int dp(float value) {
                  return (int)(
                      value *
                      getResources()
                          .getDisplayMetrics()
                          .density
                  );
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root =
                      new LinearLayout(this);

                  root.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  root.setPadding(
                      dp(24),
                      dp(35),
                      dp(24),
                      dp(24)
                  );

                  root.setBackgroundColor(
                      Color.rgb(5,20,28)
                  );

                  TextView title =
                      new TextView(this);

                  title.setText("🎯 Aim Helper");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(34);
                  title.setGravity(Gravity.CENTER);

                  root.addView(
                      title,
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(70)
                      )
                  );

                  TextView sub =
                      new TextView(this);

                  sub.setText(
                      "Mistar Manual + Pantulan"
                  );

                  sub.setTextColor(
                      Color.rgb(170,195,210)
                  );

                  sub.setTextSize(21);
                  sub.setGravity(Gravity.CENTER);

                  root.addView(
                      sub,
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(55)
                      )
                  );

                  TextView info =
                      new TextView(this);

                  info.setText(
                      "Cara pakai:\n" +
                      "1. Buka 8 Ball Pool terlebih dahulu.\n" +
                      "2. Kembali ke Aim Helper.\n" +
                      "3. Tekan Nyalakan Mistar.\n" +
                      "4. Kembali ke permainan."
                  );

                  info.setTextColor(
                      Color.rgb(205,220,228)
                  );

                  info.setTextSize(16);

                  info.setPadding(
                      dp(5),
                      dp(10),
                      dp(5),
                      dp(15)
                  );

                  root.addView(
                      info,
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(145)
                      )
                  );

                  Button permission =
                      new Button(this);

                  permission.setText(
                      "1. Izinkan tampil di atas aplikasi"
                  );

                  permission.setOnClickListener(
                      v -> {

                          if (!Settings.canDrawOverlays(
                              MainActivity.this
                          )) {

                              Intent intent =
                                  new Intent(
                                      Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                      Uri.parse(
                                          "package:" +
                                          getPackageName()
                                      )
                                  );

                              startActivity(intent);
                          }
                      }
                  );

                  root.addView(
                      permission,
                      buttonParams()
                  );

                  Button start =
                      new Button(this);

                  start.setText(
                      "2. Nyalakan Mistar"
                  );

                  start.setOnClickListener(
                      v -> {

                          if (!Settings.canDrawOverlays(
                              MainActivity.this
                          )) {
                              return;
                          }

                          Intent intent =
                              new Intent(
                                  MainActivity.this,
                                  OverlayService.class
                              );

                          if (
                              android.os.Build.VERSION.SDK_INT >= 26
                          ) {

                              startForegroundService(
                                  intent
                              );

                          } else {

                              startService(intent);
                          }

                          /*
                           * Tutup Activity supaya tidak
                           * menutupi permainan.
                           */
                          moveTaskToBack(true);
                      }
                  );

                  root.addView(
                      start,
                      buttonParams()
                  );

                  Button stop =
                      new Button(this);

                  stop.setText(
                      "3. Matikan Mistar"
                  );

                  stop.setOnClickListener(
                      v -> {

                          stopService(
                              new Intent(
                                  MainActivity.this,
                                  OverlayService.class
                              )
                          );
                      }
                  );

                  root.addView(
                      stop,
                      buttonParams()
                  );

                  TextView note =
                      new TextView(this);

                  note.setText(
                      "Panduan visual saja.\n" +
                      "Tidak ada auto-click, auto-shot, " +
                      "atau pengendalian permainan."
                  );

                  note.setTextColor(
                      Color.rgb(155,180,195)
                  );

                  note.setTextSize(15);

                  note.setPadding(
                      0,
                      dp(25),
                      0,
                      0
                  );

                  root.addView(
                      note,
                      new LinearLayout.LayoutParams(
                          -1,
                          -2
                      )
                  );

                  setContentView(root);
              }

              private LinearLayout.LayoutParams buttonParams() {

                  LinearLayout.LayoutParams p =
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(62)
                      );

                  p.setMargins(
                      0,
                      dp(7),
                      0,
                      dp(7)
                  );

                  return p;
              }
          }
          JAVA

      - name: Configure OverlayService
        run: |
          PROJECT="AimHelper-Native-Overlay-v1"

          cat > "$PROJECT/app/src/main/java/com/aimhelper/overlay/OverlayService.java" <<'JAVA'
          package com.aimhelper.overlay;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.IBinder;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.TextView;

          import java.util.Locale;

          public class OverlayService extends Service {

              private WindowManager wm;
              private AimCanvas canvas;
              private View ballHandle;
              private View aimHandle;
              private TextView panel;

              private float ballX;
              private float ballY;
              private float aimX;
              private float aimY;

              private float tableL;
              private float tableT;
              private float tableR;
              private float tableB;

              private int bounceCount = 1;

              private static final String CHANNEL =
                  "aim_helper_manual";

              private static class DragState {

                  float downRawX;
                  float downRawY;
                  int startX;
                  int startY;
                  WindowManager.LayoutParams params;
              }

              @Override
              public void onCreate() {
                  super.onCreate();

                  createChannel();

                  startForeground(
                      9,
                      notification()
                  );

                  wm =
                      (WindowManager)
                      getSystemService(
                          WINDOW_SERVICE
                      );

                  /*
                   * Overlay dibuat setelah service benar-benar
                   * aktif. Activity sudah dipindahkan ke background.
                   */
                  showOverlay();
              }

              private void showOverlay() {

                  if (!Settings.canDrawOverlays(this)) {
                      stopSelf();
                      return;
                  }

                  int w =
                      getResources()
                          .getDisplayMetrics()
                          .widthPixels;

                  int h =
                      getResources()
                          .getDisplayMetrics()
                          .heightPixels;

                  /*
                   * Posisi meja dibuat relatif terhadap layar.
                   */
                  tableL = w * 0.17f;
                  tableR = w * 0.86f;
                  tableT = h * 0.16f;
                  tableB = h * 0.91f;

                  ballX = w * 0.56f;
                  ballY = h * 0.56f;

                  aimX = w * 0.56f;
                  aimY = h * 0.30f;

                  /*
                   * Lapisan gambar FULL SCREEN:
                   * benar-benar tidak menerima sentuhan.
                   * Sentuhan hanya diterima oleh handle kecil.
                   */
                  canvas =
                      new AimCanvas(this);

                  WindowManager.LayoutParams drawParams =
                      new WindowManager.LayoutParams(
                          -1,
                          -1,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE |
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE |
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                          android.graphics.PixelFormat.TRANSLUCENT
                      );

                  wm.addView(
                      canvas,
                      drawParams
                  );

                  /*
                   * Handle kecil saja yang menerima sentuhan.
                   */
                  ballHandle =
                      createHandle("⚪");

                  aimHandle =
                      createHandle("🎯");

                  addHandle(
                      ballHandle,
                      ballX,
                      ballY,
                      true
                  );

                  addHandle(
                      aimHandle,
                      aimX,
                      aimY,
                      false
                  );

                  /*
                   * Panel informasi juga kecil dan tidak
                   * menutupi area meja.
                   */
                  panel =
                      new TextView(this);

                  panel.setTextColor(
                      Color.WHITE
                  );

                  panel.setTextSize(14);

                  panel.setTypeface(
                      Typeface.DEFAULT,
                      Typeface.BOLD
                  );

                  panel.setGravity(
                      Gravity.CENTER
                  );

                  panel.setPadding(
                      12,
                      8,
                      12,
                      8
                  );

                  panel.setBackground(
                      box(
                          Color.argb(
                              220,
                              8,
                              25,
                              35
                          ),
                          Color.rgb(
                              50,
                              240,
                              120
                          )
                      )
                  );

                  panel.setOnClickListener(
                      v -> {

                          bounceCount++;

                          if (bounceCount > 3) {
                              bounceCount = 1;
                          }

                          updateInfo();
                          canvas.invalidate();
                      }
                  );

                  WindowManager.LayoutParams pp =
                      new WindowManager.LayoutParams(
                          250,
                          115,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE |
                          WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                          android.graphics.PixelFormat.TRANSLUCENT
                      );

                  pp.gravity =
                      Gravity.TOP |
                      Gravity.END;

                  pp.x = 10;
                  pp.y = 45;

                  wm.addView(
                      panel,
                      pp
                  );

                  updateInfo();
              }

              private TextView createHandle(
                  String text
              ) {

                  TextView v =
                      new TextView(this);

                  v.setText(text);
                  v.setTextSize(26);
                  v.setGravity(Gravity.CENTER);

                  v.setBackground(
                      box(
                          Color.argb(
                              200,
                              15,
                              35,
                              45
                          ),
                          Color.rgb(
                              50,
                              240,
                              120
                          )
                      )
                  );

                  return v;
              }

              private GradientDrawable box(
                  int fill,
                  int stroke
              ) {

                  GradientDrawable d =
                      new GradientDrawable();

                  d.setColor(fill);
                  d.setCornerRadius(25);
                  d.setStroke(4, stroke);

                  return d;
              }

              private void addHandle(
                  View view,
                  float x,
                  float y,
                  boolean isBall
              ) {

                  WindowManager.LayoutParams lp =
                      new WindowManager.LayoutParams(
                          72,
                          72,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE |
                          WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                          android.graphics.PixelFormat.TRANSLUCENT
                      );

                  lp.gravity =
                      Gravity.TOP |
                      Gravity.START;

                  lp.x = (int)x - 36;
                  lp.y = (int)y - 36;

                  DragState state =
                      new DragState();

                  state.params = lp;

                  view.setTag(state);

                  wm.addView(
                      view,
                      lp
                  );

                  view.setOnTouchListener(
                      (v, event) -> {

                          DragState s =
                              (DragState)v.getTag();

                          if (
                              event.getAction() ==
                              MotionEvent.ACTION_DOWN
                          ) {

                              s.downRawX =
                                  event.getRawX();

                              s.downRawY =
                                  event.getRawY();

                              s.startX =
                                  s.params.x;

                              s.startY =
                                  s.params.y;

                              return true;
                          }

                          if (
                              event.getAction() ==
                              MotionEvent.ACTION_MOVE
                          ) {

                              int newX =
                                  s.startX +
                                  (int)(
                                      event.getRawX() -
                                      s.downRawX
                                  );

                              int newY =
                                  s.startY +
                                  (int)(
                                      event.getRawY() -
                                      s.downRawY
                                  );

                              /*
                               * Batasi handle supaya tidak
                               * keluar dari layar.
                               */
                              int screenW =
                                  getResources()
                                      .getDisplayMetrics()
                                      .widthPixels;

                              int screenH =
                                  getResources()
                                      .getDisplayMetrics()
                                      .heightPixels;

                              newX =
                                  Math.max(
                                      0,
                                      Math.min(
                                          newX,
                                          screenW - 72
                                      )
                                  );

                              newY =
                                  Math.max(
                                      0,
                                      Math.min(
                                          newY,
                                          screenH - 72
                                      )
                                  );

                              s.params.x = newX;
                              s.params.y = newY;

                              wm.updateViewLayout(
                                  v,
                                  s.params
                              );

                              float cx =
                                  newX + 36;

                              float cy =
                                  newY + 36;

                              if (isBall) {

                                  ballX = cx;
                                  ballY = cy;

                              } else {

                                  aimX = cx;
                                  aimY = cy;
                              }

                              updateInfo();

                              if (canvas != null) {
                                  canvas.invalidate();
                              }

                              return true;
                          }

                          if (
                              event.getAction() ==
                              MotionEvent.ACTION_UP
                          ) {

                              return true;
                          }

                          return true;
                      }
                  );
              }

              private void updateInfo() {

                  if (panel == null) {
                      return;
                  }

                  double angle =
                      Math.toDegrees(
                          Math.atan2(
                              aimY - ballY,
                              aimX - ballX
                          )
                      );

                  if (angle < 0) {
                      angle += 360;
                  }

                  double distance =
                      Math.hypot(
                          aimX - ballX,
                          aimY - ballY
                      );

                  panel.setText(
                      "🎯 MISTAR ON\n" +
                      "Sudut: " +
                      String.format(
                          Locale.US,
                          "%.1f°",
                          angle
                      ) +
                      "\nPantulan: " +
                      bounceCount +
                      " • Jarak: " +
                      (int)distance
                  );
              }

              private float[] wallHit(
                  float x,
                  float y,
                  float dx,
                  float dy
              ) {

                  float best =
                      Float.MAX_VALUE;

                  float hx =
                      x + dx * 10000;

                  float hy =
                      y + dy * 10000;

                  if (dx > 0) {

                      float t =
                          (tableR - x) / dx;

                      if (t > 0 && t < best) {

                          best = t;
                          hx = x + dx * t;
                          hy = y + dy * t;
                      }
                  }

                  if (dx < 0) {

                      float t =
                          (tableL - x) / dx;

                      if (t > 0 && t < best) {

                          best = t;
                          hx = x + dx * t;
                          hy = y + dy * t;
                      }
                  }

                  if (dy > 0) {

                      float t =
                          (tableB - y) / dy;

                      if (t > 0 && t < best) {

                          best = t;
                          hx = x + dx * t;
                          hy = y + dy * t;
                      }
                  }

                  if (dy < 0) {

                      float t =
                          (tableT - y) / dy;

                      if (t > 0 && t < best) {

                          best = t;
                          hx = x + dx * t;
                          hy = y + dy * t;
                      }
                  }

                  return new float[]{
                      hx,
                      hy
                  };
              }

              private void dashed(
                  Canvas c,
                  Paint p,
                  float x1,
                  float y1,
                  float x2,
                  float y2
              ) {

                  float dx = x2 - x1;
                  float dy = y2 - y1;

                  float len =
                      (float)Math.hypot(
                          dx,
                          dy
                      );

                  if (len < 1) {
                      return;
                  }

                  float ux = dx / len;
                  float uy = dy / len;

                  for (
                      float d = 0;
                      d < len;
                      d += 28
                  ) {

                      float e =
                          Math.min(
                              d + 14,
                              len
                          );

                      c.drawLine(
                          x1 + ux * d,
                          y1 + uy * d,
                          x1 + ux * e,
                          y1 + uy * e,
                          p
                      );
                  }
              }

              private class AimCanvas
                  extends View {

                  private final Paint paint =
                      new Paint(
                          Paint.ANTI_ALIAS_FLAG
                      );

                  AimCanvas(Context context) {
                      super(context);

                      paint.setStrokeCap(
                          Paint.Cap.ROUND
                      );
                  }

                  @Override
                  protected void onDraw(
                      Canvas c
                  ) {

                      super.onDraw(c);

                      float dx =
                          aimX - ballX;

                      float dy =
                          aimY - ballY;

                      float len =
                          (float)Math.hypot(
                              dx,
                              dy
                          );

                      if (len < 2) {
                          return;
                      }

                      dx /= len;
                      dy /= len;

                      paint.setStyle(
                          Paint.Style.STROKE
                      );

                      paint.setStrokeWidth(5);

                      paint.setColor(
                          Color.rgb(
                              50,
                              240,
                              120
                          )
                      );

                      c.drawLine(
                          ballX,
                          ballY,
                          aimX,
                          aimY,
                          paint
                      );

                      float x = aimX;
                      float y = aimY;

                      for (
                          int i = 0;
                          i < bounceCount;
                          i++
                      ) {

                          float[] hit =
                              wallHit(
                                  x,
                                  y,
                                  dx,
                                  dy
                              );

                          paint.setStrokeWidth(4);

                          paint.setColor(
                              Color.WHITE
                          );

                          dashed(
                              c,
                              paint,
                              x,
                              y,
                              hit[0],
                              hit[1]
                          );

                          paint.setColor(
                              Color.rgb(
                                  255,
                                  210,
                                  50
                              )
                          );

                          c.drawCircle(
                              hit[0],
                              hit[1],
                              13,
                              paint
                          );

                          boolean vertical =
                              Math.abs(
                                  hit[0] - tableL
                              ) < 5 ||
                              Math.abs(
                                  hit[0] - tableR
                              ) < 5;

                          x = hit[0];
                          y = hit[1];

                          if (vertical) {
                              dx = -dx;
                          } else {
                              dy = -dy;
                          }
                      }

                      paint.setStrokeWidth(4);

                      paint.setColor(
                          Color.rgb(
                              50,
                              240,
                              120
                          )
                      );

                      c.drawCircle(
                          ballX,
                          ballY,
                          28,
                          paint
                      );

                      c.drawCircle(
                          aimX,
                          aimY,
                          28,
                          paint
                      );

                      paint.setStyle(
                          Paint.Style.FILL
                      );

                      paint.setTextSize(22);

                      paint.setColor(
                          Color.WHITE
                      );

                      c.drawText(
                          "BIDIK",
                          aimX + 35,
                          aimY,
                          paint
                      );
                  }
              }

              private void createChannel() {

                  if (
                      Build.VERSION.SDK_INT >= 26
                  ) {

                      NotificationChannel channel =
                          new NotificationChannel(
                              CHANNEL,
                              "Aim Helper",
                              NotificationManager
                                  .IMPORTANCE_LOW
                          );

                      NotificationManager manager =
                          (NotificationManager)
                          getSystemService(
                              Context.NOTIFICATION_SERVICE
                          );

                      manager.createNotificationChannel(
                          channel
                      );
                  }
              }

              private Notification notification() {

                  return new Notification.Builder(
                      this,
                      CHANNEL
                  )
                  .setContentTitle(
                      "Aim Helper"
                  )
                  .setContentText(
                      "Mistar manual aktif"
                  )
                  .setSmallIcon(
                      android.R.drawable
                          .ic_menu_compass
                  )
                  .setOngoing(true)
                  .build();
              }

              @Override
              public void onDestroy() {

                  try {

                      if (canvas != null) {
                          wm.removeView(canvas);
                      }

                      if (ballHandle != null) {
                          wm.removeView(ballHandle);
                      }

                      if (aimHandle != null) {
                          wm.removeView(aimHandle);
                      }

                      if (panel != null) {
                          wm.removeView(panel);
                      }

                  } catch (Exception ignored) {
                  }

                  super.onDestroy();
              }

              @Override
              public IBinder onBind(
                  Intent intent
              ) {
                  return null;
              }
          }
          JAVA

      - name: Verify project
        run: |
          PROJECT="AimHelper-Native-Overlay-v1"

          test -f "$PROJECT/gradle.properties"
          test -f "$PROJECT/app/build.gradle"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT/app/src/main/java/com/aimhelper/overlay/MainActivity.java"
          test -f "$PROJECT/app/src/main/java/com/aimhelper/overlay/OverlayService.java"

          echo "AIM HELPER OVERLAY FIX OK"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build APK
        run: |
          cd AimHelper-Native-Overlay-v1
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
